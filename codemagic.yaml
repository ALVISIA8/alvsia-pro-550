workflows:
  alvisia-android:
    name: ALVSIA PRO 5.5.2-hardened
    max_build_duration: 120
    instance_type: mac_mini_m2
    # Branch restriction — release only from main
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      groups:
        - signing
      java: 17
      vars:
        PACKAGE_NAME: "com.alvsia.pro"
        # CM_BRANCH must equal main for release — enforced below
      # Set in Codemagic UI → Environment variables (group "signing"):
      # CM_KEYSTORE_PATH (uploaded keystore file) OR CM_KEYSTORE (base64)
      # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
    scripts:
      - name: Branch gate
        script: |
          set -e
          if [ "${CM_BRANCH}" != "main" ]; then
            echo "BLOCKED: release builds only from main (got: ${CM_BRANCH})"
            exit 1
          fi
          echo "Branch OK: ${CM_BRANCH}"

      - name: Validate release signing configuration
        script: |
          set -euo pipefail
          : "${CM_KEYSTORE_PASSWORD:?Missing CM_KEYSTORE_PASSWORD in Codemagic environment group signing}"
          KS=/tmp/alvsia-signing-preflight.keystore
          if [ -n "${CM_KEYSTORE_PATH:-}" ] && [ -s "${CM_KEYSTORE_PATH}" ]; then
            KS="${CM_KEYSTORE_PATH}"
          elif [ -n "${CM_KEYSTORE:-}" ] && [ -f "${CM_KEYSTORE}" ]; then
            # Codemagic may expose CM_KEYSTORE as an uploaded keystore file path.
            KS="${CM_KEYSTORE}"
          elif [ -n "${CM_KEYSTORE:-}" ]; then
            # Or CM_KEYSTORE can be configured as base64 in the signing group.
            python3 - "$KS" <<'PY'
          import base64, os, sys
          raw = "".join(os.environ["CM_KEYSTORE"].split())
          try:
              decoded = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit("CM_KEYSTORE must be a readable keystore path or valid base64") from exc
          if not decoded:
              raise SystemExit("Decoded keystore is empty; check CM_KEYSTORE")
          with open(sys.argv[1], "wb") as out:
              out.write(decoded)
          PY
          else
            echo "ERROR: set CM_KEYSTORE_PATH to an uploaded keystore, or CM_KEYSTORE to base64, in environment group signing"
            exit 1
          fi
          test -s "$KS" || { echo "ERROR: keystore file is empty or unreadable"; exit 1; }
          echo "PASS: signing keystore source and password are present"
          grep -q 'CERT_SHA256' app/build.gradle.kts || {
            echo "ERROR: certificate pin CERT_SHA256 is missing"
            exit 1
          }

      - name: Set gradlew permission
        script: |
          chmod +x ./gradlew
          java -version

      - name: Generate per-build seal seed
        script: |
          set -e
          # Generate fresh 32-byte seal seed — never reused across builds
          export ALVSIA_SEAL_SEED_HEX=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          echo "ALVSIA_SEAL_SEED_HEX=$ALVSIA_SEAL_SEED_HEX" >> $CM_ENV
          echo "Seal seed generated ($(echo $ALVSIA_SEAL_SEED_HEX | wc -c) chars)"

      - name: Run source security checks
        script: |
          set -e
          python3 tools/security_release_check.py
          # APK-level audit runs after assembleRelease; do not invoke it here
          # with an unsupported pseudo-mode that is silently ignored.

      - name: Seal Python modules
        script: |
          set -e
          python3 -m pip install --user cryptography
          python3 tools/seal_python.py --seal
          echo "Python modules sealed"

      - name: Seal runtime assets
        script: |
          set -e
          python3 tools/seal_assets.py
          test ! -e app/src/main/assets/unluac/unluac.jar || \
            (echo "FAIL: plaintext jars still present after sealing" && exit 1)

      - name: Inject release seal seed into native library
        script: |
          set -e
          python3 - <<'PY'
          import os, pathlib
          seed = os.environ.get("ALVSIA_SEAL_SEED_HEX", "")
          if len(seed) != 64 or any(c not in "0123456789abcdefABCDEF" for c in seed):
              raise SystemExit("Invalid per-build seal seed")
          values = ", ".join("0x" + seed[i:i+2] for i in range(0, 64, 2))
          path = pathlib.Path("app/src/main/cpp/rasp_guard.cpp")
          source = path.read_text()
          old = "static const unsigned char _alvsia_seal_seed[32] = {0};"
          new = "static const unsigned char _alvsia_seal_seed[32] = {" + values + "};"
          if source.count(old) != 1:
              raise SystemExit("Native seal seed placeholder missing or ambiguous")
          path.write_text(source.replace(old, new))
          print("Native seal seed injected for this release build")
          PY

      - name: Build release APK
        script: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build_full.log
          STATUS=${PIPESTATUS[0]}
          echo "===== ERRORS (if any) ====="
          grep -E "^e:|What went wrong|Caused by:|FAILED|error:" build_full.log | head -50 || true
          echo "===== APK outputs ====="
          find app/build/outputs -name "*.apk" -type f 2>/dev/null || true
          exit $STATUS

      - name: Strip VCS metadata from unsigned APK
        script: |
          set -e
          APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          test -n "$APK"
          python3 tools/strip_vcs_metadata.py "$APK"

      - name: Audit release APK
        script: |
          set -e
          APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          test -n "$APK"
          python3 tools/audit_release_apk.py "$APK"

      - name: Audit packaged local metadata
        script: |
          set -e
          APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          test -n "$APK" || { echo "ERROR: release APK not found for metadata audit"; exit 1; }
          python3 tools/audit_release_metadata.py "$APK"

      - name: Restore Python sources
        script: |
          python3 tools/seal_python.py --restore || true

      - name: Build XopProtector candidate (opt-in, preserves baseline APK)
        script: |
          set -euo pipefail
          # Enable only for a deliberate candidate run; never silently replace baseline.
          if [ "${ALVSIA_XOPPROTECTOR_ENABLED:-false}" != "true" ]; then
            echo "SKIP: XopProtector candidate disabled; baseline release path unchanged"
            exit 0
          fi
          BASE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$BASE_APK" && test -s "$BASE_APK"
          XOP_DIR="$CM_BUILD_DIR/.xopprotector-src"
          rm -rf "$XOP_DIR"
          git clone --filter=blob:none https://github.com/xopJack/XopProtector.git "$XOP_DIR"
          git -C "$XOP_DIR" checkout --detach 5990c31
          cd "$XOP_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon :packer:jar exportShellFiles
          PACKER_JAR="$(find packer/build/libs -maxdepth 1 -type f -name 'protector-packer-*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$PACKER_JAR" && test -s "$PACKER_JAR"
          test -d executable/shell-files
          cd "$CM_BUILD_DIR"
          # Deliberately avoid SO/asset/resource rewriting and VMP on the first pass:
          # Chaquopy, JNI, resource IDs and the custom Application require device smoke tests.
          # The non-matching allowlist disables automatic business-class hollowing.
          java -jar "$XOP_DIR/$PACKER_JAR" "$BASE_APK" \
            -o "$CM_BUILD_DIR/ALVISIA_PRO_5.5.2-xop_candidate_unsigned.apk" \
            --shell-dir "$XOP_DIR/executable/shell-files" \
            --profile balanced \
            --no-protect-so \
            --hollow-prefix Lcom/alvsia/pro/xop_candidate_disabled/
          test -s "$CM_BUILD_DIR/ALVISIA_PRO_5.5.2-xop_candidate_unsigned.apk"
          echo "XopProtector candidate generated; not release-approved until runtime smoke tests pass."
          echo "ALVSIA_XOP_UNSIGNED=$CM_BUILD_DIR/ALVISIA_PRO_5.5.2-xop_candidate_unsigned.apk" >> "$CM_ENV"

      - name: Exclude VCS metadata from packaging
        script: |
          # Remove git metadata from release artifacts
          find app/build -name "META-INF/version-control-info.textproto" -delete || true
          # gradle.kts excludes this via packaging block (see build.gradle.kts)

      - name: Sign and verify release APK
        script: |
          set -euo pipefail
          UNSIGNED="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$UNSIGNED" || { echo "ERROR: release APK not found"; exit 1; }
          SIGNED_APK="$SIGNED_APK"
          if [ "${ALVSIA_XOPPROTECTOR_ENABLED:-false}" = "true" ]; then
            UNSIGNED="$CM_BUILD_DIR/ALVISIA_PRO_5.5.2-xop_candidate_unsigned.apk"
            SIGNED_APK="ALVISIA_PRO_5.5.2-xop_candidate_signed.apk"
            test -s "$UNSIGNED" || { echo "ERROR: XopProtector enabled but candidate APK is missing"; exit 1; }
          fi

          # Release builds must never silently publish an unsigned APK.
          : "${CM_KEYSTORE_PASSWORD:?Missing CM_KEYSTORE_PASSWORD in Codemagic environment group signing}"
          KS=/tmp/alvsia-release.keystore
          if [ -n "${CM_KEYSTORE_PATH:-}" ] && [ -s "${CM_KEYSTORE_PATH}" ]; then
            KS="${CM_KEYSTORE_PATH}"
          elif [ -n "${CM_KEYSTORE:-}" ] && [ -f "${CM_KEYSTORE}" ]; then
            KS="${CM_KEYSTORE}"
          elif [ -n "${CM_KEYSTORE:-}" ]; then
            # Decode base64-configured keystore without printing its contents.
            python3 - "$KS" <<'PY'
          import base64, os, sys
          with open(sys.argv[1], "wb") as out:
              out.write(base64.b64decode("".join(os.environ["CM_KEYSTORE"].split()), validate=True))
          PY
          else
            echo "ERROR: configure CM_KEYSTORE_PATH (uploaded keystore) or CM_KEYSTORE (base64)"
            exit 1
          fi
          test -s "$KS" || { echo "ERROR: keystore file is empty or unreadable"; exit 1; }
          KSPASS="$CM_KEYSTORE_PASSWORD"
          ALIAS="${CM_KEY_ALIAS:-alvsia}"
          KEYPASS="${CM_KEY_PASSWORD:-$KSPASS}"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT/build-tools" || {
            echo "ERROR: Android SDK/build-tools not found (ANDROID_SDK_ROOT/ANDROID_HOME)"
            exit 1
          }
          BUILD_TOOLS="$(python3 - "$SDK_ROOT/build-tools" <<'PY'
          import os, re, sys
          root = sys.argv[1]
          dirs = [os.path.join(root, x) for x in os.listdir(root)
                  if os.path.isdir(os.path.join(root, x))]
          def version(path):
              nums = re.findall(r'\d+', os.path.basename(path))
              return tuple(int(n) for n in nums) if nums else (0,)
          print(max(dirs, key=version) if dirs else "")
          PY
          )"
          test -x "$BUILD_TOOLS/zipalign" || { echo "ERROR: zipalign not found in $BUILD_TOOLS"; exit 1; }
          test -x "$BUILD_TOOLS/apksigner" || { echo "ERROR: apksigner not found in $BUILD_TOOLS"; exit 1; }

          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" /tmp/alvsia-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KSPASS" --key-pass "pass:$KEYPASS" \
            --out "$SIGNED_APK" /tmp/alvsia-release-aligned.apk
          VERIFY_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs $SIGNED_APK)"
          printf '%s\n' "$VERIFY_OUTPUT"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Eqi 'Verified using v1 scheme.*: false' || {
            echo "ERROR: v1/JAR signing must be disabled for release APK"
            exit 1
          }
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Eqi 'Verified using v2 scheme.*: true' || {
            echo "ERROR: APK v2 signature verification failed"
            exit 1
          }
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Eqi 'Verified using v3 scheme.*: true' || {
            echo "ERROR: APK v3 signature verification failed"
            exit 1
          }

          EXPECTED_CERT_SHA256="$(grep -oE '[0-9a-fA-F]{64}' app/build.gradle.kts | head -n 1 | tr '[:upper:]' '[:lower:]')"
          ACTUAL_CERT_SHA256="$("$BUILD_TOOLS/apksigner" verify --print-certs $SIGNED_APK | awk -F': ' '/certificate SHA-256 digest/ {print $NF; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$EXPECTED_CERT_SHA256" || { echo "ERROR: CERT_SHA256 pin not found in app/build.gradle.kts"; exit 1; }
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256" || {
            echo "ERROR: APK signing certificate does not match app CERT_SHA256 pin"
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT_SHA256"
            exit 1
          }
          echo "PASS: signed APK verified and certificate pin matches"
          ls -lh $SIGNED_APK
          # Verify the exact final signed artifact, not only its unsigned predecessor.
          "$BUILD_TOOLS/zipalign" -c -v 4 $SIGNED_APK
          python3 tools/audit_release_apk.py $SIGNED_APK
          BADGING="$("$BUILD_TOOLS/aapt" dump badging $SIGNED_APK)"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.alvsia.pro' versionCode='98' versionName='5.5.2-hardened'" || {
            echo "ERROR: final APK package/version does not match release source"
            printf '%s\n' "$BADGING" | grep -E "^package:|^application-label:" || true
            exit 1
          }
          echo "PASS: final APK package/version verified"
          sha256sum $SIGNED_APK
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - $SIGNED_APK
      - ALVISIA_PRO_5.5.2-xop_candidate_unsigned.apk
      - ALVISIA_PRO_5.5.2-xop_candidate_signed.apk
      - ALVISIA_PRO_5.5.2-hardened_unsigned.apk
      - build_full.log

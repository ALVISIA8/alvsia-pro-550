workflows:
  alvisia-android:
    name: ALVISIA PRO 5.5.0
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - signing
      java: 21
      vars:
        PACKAGE_NAME: "com.alvsia.pro"
      # REQUIRED in Codemagic UI → Environment variables (group "signing"):
      # CM_KEYSTORE: base64-encoded alvsia release JKS (keep secret; never commit it)
      # CM_KEYSTORE_PASSWORD
      # CM_KEY_ALIAS: alvsia
      # CM_KEY_PASSWORD (may equal CM_KEYSTORE_PASSWORD if the key uses the same password)
    scripts:
      - name: Enforce single release branch (main only)
        script: |
          set -euo pipefail
          BRANCH="${CM_BRANCH:-}"
          if [ "$BRANCH" != "main" ]; then
            echo "ERROR: ALVISIA PRO release builds are allowed only from branch main."
            echo "Current CM_BRANCH='${BRANCH:-unset}'. No APK will be built from another branch."
            exit 2
          fi
          echo "Release branch verified: main"

      - name: Set gradlew permission and install Android SDK 35
        script: |
          set -euo pipefail
          chmod +x ./gradlew
          java -version
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER=""
          if [ -n "$SDK_ROOT" ]; then SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)"; fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Check release signing secrets
        script: |
          set -euo pipefail
          missing=0
          for name in CM_KEYSTORE CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: required signing variable is missing: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Attach the 'signing' environment group in CodeMagic. Do not store signing secrets in Git."
            exit 2
          fi
          if [ "$CM_KEY_ALIAS" != "alvsia" ]; then
            echo "ERROR: CM_KEY_ALIAS must be the release alias 'alvsia'."
            exit 2
          fi
          echo "All required signing variables are present; values remain hidden."

      - name: Generate per-build sealed payload seed
        script: |
          set -euo pipefail
          SEED="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          printf '%s' "$SEED" > "$CM_BUILD_DIR/.alvsia-build-seed"
          chmod 600 "$CM_BUILD_DIR/.alvsia-build-seed"
          unset SEED

      - name: Run regression and VANTA security tests
        script: |
          set -e
          export ALVSIA_SEAL_SEED_HEX="$(cat "$CM_BUILD_DIR/.alvsia-build-seed")"
          python3 --version
          python3 -m compileall -q app/src/main/python
          python3 tests/test_lua_engine.py
          python3 tests/test_bgmi_transform.py
          python3 tests/test_pak_extraction.py
          python3 tests/test_tool_dispatch.py
          python3 tests/test_vanta_redteam.py
          python3 tools/security_release_check.py
          python3 -m pip install --disable-pip-version-check cryptography
          python3 tools/seal_python.py --restore
          python3 tools/seal_python.py --seal
          python3 tools/seal_python.py --restore
          if command -v lua5.3 >/dev/null 2>&1; then
            LUA_BIN=lua5.3 bash tests/test_unluac_integration.sh
          elif command -v lua >/dev/null 2>&1; then
            LUA_BIN=lua bash tests/test_unluac_integration.sh
          else
            echo "Lua 5.3 not installed on this runner; Lua integration is covered by GitHub Actions."
          fi

      - name: Run Android unit tests
        script: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Seal runtime JAR assets
        script: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography
          python3 tools/seal_assets.py

      - name: Seal protected Python modules
        script: |
          set -euo pipefail
          export ALVSIA_SEAL_SEED_HEX="$(cat "$CM_BUILD_DIR/.alvsia-build-seed")"
          python3 tools/seal_python.py --restore
          python3 tools/seal_python.py --seal

      - name: Build and obfuscate release APK with AndResGuard
        script: |
          set -o pipefail
          export ALVSIA_SEAL_SEED_HEX="$(cat "$CM_BUILD_DIR/.alvsia-build-seed")"
          restore_python() { python3 tools/seal_python.py --restore || true; rm -f "$CM_BUILD_DIR/.alvsia-build-seed"; }
          trap restore_python EXIT
          ./gradlew clean resguardRelease --stacktrace --no-daemon 2>&1 | tee build_full.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -eq 0 ]; then
            mkdir -p app/build/outputs/andresguard
            APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
            test -n "$APK" && test -s "$APK" || exit 1
            cp "$APK" app/build/outputs/andresguard/ALVISIA_PRO_5.5.0_resguard.apk
          fi
          echo "===== ERRORS (if any) ====="
          grep -E "^e:|What went wrong|Caused by:|FAILED|error:" build_full.log | head -50 || true
          echo "===== APK outputs ====="
          find app/build/outputs -name "*.apk" -type f 2>/dev/null || true
          # Preserve the Gradle pipeline exit code captured immediately after tee.
          exit $STATUS

      - name: Optional licensed Virbox protection stage
        script: |
          set -euo pipefail
          APK="app/build/outputs/andresguard/ALVISIA_PRO_5.5.0_resguard.apk"
          if [ "${ALVSIA_VIRBOX_REQUIRED:-0}" = "1" ]; then
            bash tools/virbox_protect_release.sh "$APK" "app/build/outputs/andresguard/ALVISIA_PRO_5.5.0_virbox.apk"
            cp "app/build/outputs/andresguard/ALVISIA_PRO_5.5.0_virbox.apk" "$APK"
            echo "Licensed Virbox stage completed; downstream audit and signing will use protected APK."
          else
            echo "Virbox stage not enabled. Set ALVSIA_VIRBOX_REQUIRED=1, VIRBOX_PROTECTOR_BIN, and VIRBOX_SSP_FILE in CodeMagic only after installing the licensed vendor CLI and generating the .ssp profile."
          fi

      - name: Verify release APK and native RASP library
        script: |
          set -euo pipefail
          APK="app/build/outputs/andresguard/ALVISIA_PRO_5.5.0_resguard.apk"
          test -s "$APK"
          test -n "$APK"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/librasp_guard.so"
          echo "Release APK input validated: $APK"

      - name: Audit release APK protection layers
        script: |
          set -euo pipefail
          APK="app/build/outputs/andresguard/ALVISIA_PRO_5.5.0_resguard.apk"
          test -s "$APK"
          python3 tools/audit_release_apk.py "$APK"
          cat release_security_audit.txt

      - name: Sign and verify production release APK
        script: |
          set -euo pipefail
          APK="app/build/outputs/andresguard/ALVISIA_PRO_5.5.0_resguard.apk"
          if [ ! -s "$APK" ]; then APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1); fi
          test -n "$APK"

          # Never report a production release as successful if signing secrets are absent.
          if [ -z "${CM_KEYSTORE:-}" ] || [ -z "${CM_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: Configure CM_KEYSTORE (base64 JKS), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, and CM_KEY_PASSWORD in Codemagic."
            echo "Unsigned APKs are not accepted as production release artifacts."
            exit 2
          fi

          KS=/tmp/alvsia-release.keystore
          trap 'rm -f "$KS" /tmp/alvsia-aligned.apk' EXIT
          printf '%s' "$CM_KEYSTORE" | base64 -d > "$KS"
          test -s "$KS"
          KSPASS="$CM_KEYSTORE_PASSWORD"
          ALIAS="${CM_KEY_ALIAS:-alvsia}"
          KEYPASS="${CM_KEY_PASSWORD:-$KSPASS}"

          BUILD_TOOLS=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" /tmp/alvsia-aligned.apk

          SIGNED=ALVSIA_PRO_5.5.0_signed.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KSPASS" \
            --key-pass "pass:$KEYPASS" \
            --out "$SIGNED" \
            /tmp/alvsia-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED" | tee ALVSIA_PRO_5.5.0_signing-verification.txt
          ACTUAL_CERT=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {gsub(":", "", $2); print tolower($2); exit}' ALVSIA_PRO_5.5.0_signing-verification.txt)
          EXPECTED_CERT="99b33815c88a17abbcfe22be15250363f6dfc79c11ffc980e71b62b74b1f295c"
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "ERROR: APK signer certificate does not match the ALVISIA release certificate."
            echo "Expected: $EXPECTED_CERT"
            echo "Actual: ${ACTUAL_CERT:-missing}"
            exit 3
          fi
          shasum -a 256 "$SIGNED" | tee ALVSIA_PRO_5.5.0_release.sha256
          ls -lh "$SIGNED"

    artifacts:
      # Only the verified, certificate-pinned production-signed APK is a release artifact.
      - ALVSIA_PRO_5.5.0_signed.apk
      - ALVSIA_PRO_5.5.0_release.sha256
      - ALVSIA_PRO_5.5.0_signing-verification.txt
      - build_full.log
      - release_security_audit.txt

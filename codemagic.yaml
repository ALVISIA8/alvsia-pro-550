workflows:
  alvisia-android:
    name: ALVISIA PRO 5.5.0
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17
      xcode: 26.4
      ndk: 27.3.13750724
      vars:
        PACKAGE_NAME: "com.alvsia.pro"

    scripts:

      - name: Set gradlew permission
        script: |
          set -e
          chmod +x ./gradlew
          java -version

      - name: Verify R5.4 source
        script: |
          set -e
          echo "===== R5.4 SOURCE CHECK ====="
          git branch --show-current
          git log -1 --oneline
          test -f app/src/main/cpp/rasp_guard.cpp
          test -f app/src/main/cpp/CMakeLists.txt
          test -d app/src/main/cpp/third_party/mbedtls
          grep -q "nativeSealDecrypt" app/src/main/cpp/rasp_guard.cpp
          grep -q "mbedtls_gcm_auth_decrypt" app/src/main/cpp/rasp_guard.cpp
          echo "R5.4 native source: OK"

      - name: Prepare Python 3.14
        script: |
          set -e
          brew install python@3.14 || true
          PY314="/opt/homebrew/opt/python@3.14/bin/python3.14"
          test -x "$PY314"
          "$PY314" --version

      - name: Build release APK
        script: |
          set +e
          set -o pipefail

          rm -f build_full.log native_failure_report.txt native_error_summary.txt

          echo "===== ALVISIA R5.4 BUILD ====="
          echo "COMMIT:"
          git log -1 --oneline
          echo "BRANCH:"
          git branch --show-current
          echo ""

          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace --info --console=plain > build_full.log 2>&1
          STATUS=$?

          echo ""
          echo "=================================================="
          echo "ALVISIA BUILD FAILURE SUMMARY"
          echo "=================================================="
          echo "GIT COMMIT:"
          git rev-parse --short HEAD || true
          echo "GIT BRANCH:"
          git branch --show-current || true

          echo ""
          echo "FAILED TASK:"
          grep -nE "Execution failed for task|> Task .* FAILED" build_full.log | tail -20 || true

          echo ""
          echo "GRADLE ERROR:"
          grep -nE "^FAILURE:|^\* What went wrong:|^Caused by:" build_full.log | tail -30 || true

          echo ""
          echo "NATIVE / CMAKE ERROR:"
          grep -nEi "CMake Error|fatal error:|undefined reference|ld\.lld|clang.*error|ninja: error|FAILED:" build_full.log | tail -40 || true

          echo ""
          echo "LAST LOG LINES:"
          tail -20 build_full.log

          echo ""
          echo "=================================================="
          echo "FINAL BUILD STATUS = $STATUS"
          echo "=================================================="

          exit "$STATUS"
          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "=================================================="
          echo "GRADLE FAILURE TASKS"
          echo "=================================================="
          grep -nE "^\* What went wrong:|^Execution failed for task|^FAILURE:|^> Task .* FAILED|^Caused by:" build_full.log | tail -80 || true

          echo ""
          echo "=================================================="
          echo "NATIVE FAILURE"
          echo "=================================================="
          grep -nEi "CMake Error|FAILED:|fatal error:|undefined reference|ld\.lld|clang.*error|ninja: error|subcommand failed" build_full.log | head -100 || true

          echo ""
          echo "=================================================="
          echo "GRADLE TASK STATUS"
          echo "=================================================="
          grep -nE "^> Task " build_full.log | tail -100 || true

          echo ""
          echo "=================================================="
          echo "LAST 200 LINES"
          echo "=================================================="
          tail -200 build_full.log

          echo ""
          echo "=================================================="
          echo "FINAL BUILD STATUS = $STATUS"
          echo "=================================================="

          exit "$STATUS"
          STATUS=${PIPESTATUS[0]}

          {
            echo "===== BUILD STATUS ====="
            echo "STATUS=$STATUS"
            echo ""

            echo "===== GRADLE FAILURE ====="
            grep -n -B 40 -A 80 \
              -E "Execution failed for task|What went wrong|Caused by:|ProcessException|ExecException|FAILURE: Build failed" \
              build_full.log | tail -250 || true

            echo ""
            echo "===== FIRST NATIVE ERRORS ====="
            grep -nEi \
              "CMake Error|FAILED:|fatal error:|error:|undefined reference|cannot find|No such file|not found|ld.lld|clang.*error|ninja: error|subcommand failed|duplicate symbol|multiple definition|unresolved|Could NOT find" \
              build_full.log | head -120 || true

            echo ""
            echo "===== CMAKE ERROR LOG ====="
            find app/.cxx -type f -name "CMakeError.log" \
              -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \; \
              2>/dev/null || true

            echo ""
            echo "===== LAST BUILD LINES ====="
            tail -120 build_full.log || true
          } > native_error_summary.txt

          cp native_error_summary.txt native_failure_report.txt

          echo ""
          echo "=================================================="
          echo " FIRST ERROR / FINAL DIAGNOSTIC"
          echo "=================================================="
          cat native_error_summary.txt
          echo ""
          echo "=================================================="
          echo " FINAL BUILD STATUS = $STATUS"
          echo "=================================================="

          exit "$STATUS"

      - name: Audit release APK protection layers
        script: |
          set -e
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "No release APK found for security audit"
            exit 1
          fi
          echo "Auditing artifact: $APK"
          python3 tools/audit_release_apk.py "$APK"

      - name: Sign APK if keystore present
        script: |
          set -e

          UNSIGNED=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)

          if [ -z "$UNSIGNED" ]; then
            echo "No APK found — build step failed"
            exit 1
          fi

          echo "Found: $UNSIGNED"

          if [ -n "${CM_KEYSTORE:-}" ]; then
            echo "$CM_KEYSTORE" | base64 -d > /tmp/alvsia.keystore
            KS="/tmp/alvsia.keystore"
            KSPASS="${CM_KEYSTORE_PASSWORD}"
            ALIAS="${CM_KEY_ALIAS:-alvsia}"
            KEYPASS="${CM_KEY_PASSWORD:-$KSPASS}"

          elif [ -f alvsia-release.keystore ]; then
            KS="alvsia-release.keystore"
            KSPASS="${CM_KEYSTORE_PASSWORD:-}"
            ALIAS="${CM_KEY_ALIAS:-alvsia}"
            KEYPASS="${CM_KEY_PASSWORD:-$KSPASS}"

          else
            echo "No keystore — leaving unsigned APK"
            cp "$UNSIGNED" ALVSIA_PRO_5.5.0_unsigned.apk
            exit 0
          fi

          if [ -z "$KSPASS" ]; then
            echo "CM_KEYSTORE_PASSWORD not set — copying unsigned APK"
            cp "$UNSIGNED" ALVSIA_PRO_5.5.0_unsigned.apk
            exit 0
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          ALIGNED="/tmp/alvsia-aligned.apk"
          SIGNED="ALVSIA_PRO_5.5.0_signed.apk"

          "$ZIPALIGN" -f 4 "$UNSIGNED" "$ALIGNED"

          "$APKSIGNER" sign \
            --ks "$KS" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KSPASS" \
            --key-pass "pass:$KEYPASS" \
            --out "$SIGNED" \
            "$ALIGNED"

          "$APKSIGNER" verify "$SIGNED"

          echo "Signed OK: $SIGNED"
          ls -lh "$SIGNED"

    artifacts:
      - app/build/outputs/apk/**/*.apk
      - ALVSIA_PRO_5.5.0_signed.apk
      - ALVSIA_PRO_5.5.0_unsigned.apk
      - build_full.log
      - native_failure_report.txt
      - release_security_audit.txt

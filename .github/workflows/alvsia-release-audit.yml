name: ALVSIA release safety audit

on:
  push:
    branches: [main, release/5.5.2-19-module-redesign]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Chaquopy host-side pip imports cgi; Python 3.13+ removes it.
      - name: Set up compatible host Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 19-module catalog and security baseline
        run: python3 scripts/release_safety_audit.py
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle lint
        run: ./gradlew :app:lintRelease --no-daemon

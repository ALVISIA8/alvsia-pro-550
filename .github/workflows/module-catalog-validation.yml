name: Module catalog consistency

on:
  push:
    branches: [main]
    paths:
      - "tests/test_module_catalog_consistency.py"
      - "app/src/main/java/com/alvsia/pro/tool/ToolCatalog.kt"
      - "app/src/main/java/com/alvsia/pro/tool/SubMenus.kt"
      - "app/src/main/java/com/alvsia/pro/ui/home/HomeScreen.kt"
      - "app/src/main/java/com/alvsia/pro/ui/profile/ProfileScreen.kt"
      - ".github/workflows/module-catalog-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/test_module_catalog_consistency.py"
      - "app/src/main/java/com/alvsia/pro/tool/ToolCatalog.kt"
      - "app/src/main/java/com/alvsia/pro/tool/SubMenus.kt"
      - "app/src/main/java/com/alvsia/pro/ui/home/HomeScreen.kt"
      - "app/src/main/java/com/alvsia/pro/ui/profile/ProfileScreen.kt"
      - ".github/workflows/module-catalog-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate 19-module catalog consistency
        run: python3 tests/test_module_catalog_consistency.py

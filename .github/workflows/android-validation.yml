name: Android validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973 cmake;3.22.1

      - name: Verify wrapper
        run: |
          test -f ./gradlew
          chmod +x ./gradlew
          java -version
          python --version
          ./gradlew --version

      - name: Compile all bundled Python modules
        run: python -m compileall -q app/src/main/python

      - name: Run Lua engine regression tests
        run: python tests/test_lua_engine.py

      - name: Run BGMI Lua transform regression tests
        run: python tests/test_bgmi_transform.py

      - name: Run PAK extraction regression tests
        run: python tests/test_pak_extraction.py

      - name: Test bundled Lua 5.3 decompiler
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3
          bash tests/test_unluac_integration.sh

      - name: Validate all tool menu routes
        run: python tests/test_tool_dispatch.py

      - name: Run VANTA red-team static regression checks
        run: python tests/test_vanta_redteam.py

      - name: Run security source gates
        run: python tools/security_release_check.py

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Seal runtime JAR assets
        run: |
          python -m pip install --disable-pip-version-check cryptography
          python tools/seal_assets.py

      - name: Seal protected Python modules
        run: |
          python tools/seal_python.py --restore
          python tools/seal_python.py --seal

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          restore_python() { python tools/seal_python.py --restore || true; }
          trap restore_python EXIT
          ./gradlew clean assembleRelease --stacktrace --no-daemon

      - name: Audit release APK protection layers
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$APK"
          python tools/audit_release_apk.py "$APK"

      - name: Verify native RASP library and calculate APK checksum
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$APK"
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/librasp_guard.so'
          mkdir -p release-candidate
          cp "$APK" release-candidate/ALVSIA_PRO_5.5.0_release-candidate.apk
          sha256sum release-candidate/ALVSIA_PRO_5.5.0_release-candidate.apk | tee release-candidate/ALVSIA_PRO_5.5.0_release-candidate.sha256

      - name: Upload release candidate APK
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: ALVISIA-PRO-5.5.0-RELEASE-CANDIDATE
          path: release-candidate/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            **/build/reports/tests/**
            **/build/outputs/apk/**
            **/build/outputs/mapping/**
            release_security_audit.txt
          if-no-files-found: ignore
          retention-days: 7

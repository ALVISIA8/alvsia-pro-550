name: ALVISIA PRO Android Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alvisia-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Verify source and wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f app/build.gradle.kts
          chmod +x ./gradlew
          python -m compileall -q app/src/main/python
          java -version
          ./gradlew --version

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          # Generate a unique per-build seed so native code and this build share it.
          export ALVSIA_SEAL_SEED_HEX="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$ALVSIA_SEAL_SEED_HEX"
          ./gradlew clean resguardRelease --stacktrace --no-daemon
          APK="$(find app/build/outputs -type f -name '*.apk' -size +0c | grep -E 'release|andresguard' | head -n 1 || true)"
          if [[ -z "$APK" ]]; then
            echo "::error::Gradle finished without a release APK. Inspect the Gradle output above."
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          mkdir -p release-candidate
          cp "$APK" release-candidate/ALVISIA_PRO_5.5.0_RELEASE_CANDIDATE_UNSIGNED.apk
          sha256sum release-candidate/*.apk | tee release-candidate/SHA256SUMS.txt
          unzip -Z1 release-candidate/*.apk | grep -Fx 'lib/arm64-v8a/librasp_guard.so'

      - name: Upload unsigned release candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALVISIA-PRO-5.5.0-RELEASE-CANDIDATE-UNSIGNED
          path: release-candidate/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ALVISIA-PRO-BUILD-DIAGNOSTICS
          path: |
            **/build/reports/**
            **/build/outputs/**
          if-no-files-found: ignore
          retention-days: 7

name: Android Security Validation
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate fresh per-build seal seed
        run: |
          SEED=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          echo "ALVSIA_SEAL_SEED_HEX=$SEED" >> $GITHUB_ENV
          echo "Seal seed length: ${#SEED}"

      - name: Run source-level security checks
        run: python3 tools/security_release_check.py

      - name: Run sealed payload cryptographic tests
        run: |
          python3 -m pip install --disable-pip-version-check cryptography
          python3 tests/test_seal_python_payloads.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test Android debug variant
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare sealed release inputs
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography
          python3 tools/seal_python.py --seal
          python3 tools/seal_assets.py
          test ! -e app/src/main/assets/unluac/unluac.jar

      - name: Inject per-build seed into native library source
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          seed = os.environ.get("ALVSIA_SEAL_SEED_HEX", "")
          if len(seed) != 64 or any(c not in "0123456789abcdefABCDEF" for c in seed):
              raise SystemExit("Invalid per-build seal seed")
          path = Path("app/src/main/cpp/rasp_guard.cpp")
          source = path.read_text()
          old = "static const unsigned char _alvsia_seal_seed[32] = {0};"
          values = ", ".join("0x" + seed[i:i+2] for i in range(0, 64, 2))
          if source.count(old) != 1:
              raise SystemExit("Native seed placeholder missing or ambiguous")
          path.write_text(source.replace(old, "static const unsigned char _alvsia_seal_seed[32] = {" + values + "};"))
          PY

      - name: Build release APK
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          # Strip generated VCS metadata before auditing the unsigned APK.
          python3 - "$APK" <<'PY'
          import os, sys, zipfile
          from pathlib import Path
          apk = Path(sys.argv[1])
          tmp = apk.with_suffix(".stripped.apk")
          with zipfile.ZipFile(apk, "r") as src, zipfile.ZipFile(tmp, "w") as dst:
              dst.comment = src.comment
              for item in src.infolist():
                  if item.filename.endswith("version-control-info.textproto"):
                      continue
                  dst.writestr(item, src.read(item.filename))
          os.replace(tmp, apk)
          PY
          python3 tools/audit_release_apk.py "$APK"
          mkdir -p validation-artifacts
          cp "$APK" validation-artifacts/ALVISIA_PRO_5.5.0_release_unsigned.apk
          cp release_security_audit.txt validation-artifacts/
          sha256sum validation-artifacts/*.apk

      - name: Publish private draft validation release (avoids Actions artifact quota)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alvsia-validation-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ALVISIA PRO validation build ${{ github.run_number }}
          draft: true
          prerelease: true
          files: |
            validation-artifacts/ALVISIA_PRO_5.5.0_release_unsigned.apk
            validation-artifacts/release_security_audit.txt
          fail_on_unmatched_files: true

      - name: Restore source files after sealed build
        if: always()
        run: python3 tools/seal_python.py --restore

      - name: Check no debug flags in manifest
        run: |
          if grep -q 'android:debuggable="true"' app/src/main/AndroidManifest.xml; then
            echo "FAIL: debuggable=true in manifest"; exit 1
          fi
          echo "OK: manifest clean"

      - name: Verify CERT_SHA256 in build config
        run: grep -q "CERT_SHA256" app/build.gradle.kts || (echo "FAIL" && exit 1)

      - name: Verify branch restriction
        run: |
          BRANCH="${GITHUB_REF_NAME:-}"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$BRANCH" != "main" ]; then
            echo "WARNING: push from non-main branch: $BRANCH"
          fi
          echo "Branch: $BRANCH"

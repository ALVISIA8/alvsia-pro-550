name: ALVISIA PRO Android Release Build

on:
  push:
    branches: [main, 'security/vanta-audit-50-layer-20261013']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alvisia-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Verify source and wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f app/build.gradle.kts
          chmod +x ./gradlew
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("app/src/main")
          forbidden = {
              "OTP screen": re.compile(r"\bOtpScreen\b", re.I),
              "OTP request method": re.compile(r"\brequestOtp\b", re.I),
              "OTP verify method": re.compile(r"\bverifyOtp\b", re.I),
              "OTP endpoint helper": re.compile(r"\bpathOtp\b", re.I),
              "OTP-derived tool ticket": re.compile(r"\btool_ticket\b", re.I),
              "OTP navigation state": re.compile(r"""screen\s*=\s*["']otp["']""", re.I),
          }
          failures = []
          for path in root.rglob("*"):
              if path.suffix.lower() not in {".kt", ".java", ".py"} or not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              for label, pattern in forbidden.items():
                  if pattern.search(text):
                      failures.append(f"{path}: leftover {label}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("License-only auth source gate passed: no client OTP screen, methods, navigation, or tool_ticket flow.")
          PY
          python3 scripts/verify_license_only_auth.py
          python -m pip install --disable-pip-version-check pycryptodome
          python -m unittest discover -s tests -v
          python -m compileall -q app/src/main/python scripts
          java -version
          ./gradlew --version

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          # Generate a unique per-build seed so native code and this build share it.
          export ALVSIA_SEAL_SEED_HEX="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$ALVSIA_SEAL_SEED_HEX"
          ./gradlew clean resguardRelease --stacktrace --no-daemon
          APK="$(find app/build/outputs -type f -name '*.apk' -size +0c | grep -E 'release|andresguard' | head -n 1 || true)"
          if [[ -z "$APK" ]]; then
            echo "::error::Gradle finished without a release APK. Inspect the Gradle output above."
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          mkdir -p release-candidate
          cp "$APK" release-candidate/ALVISIA_PRO_5.5.0_RELEASE_CANDIDATE_UNSIGNED.apk
          sha256sum release-candidate/*.apk | tee release-candidate/SHA256SUMS.txt
          {
            echo "project=ALVISIA PRO"
            echo "package=com.alvsia.pro"
            echo "versionName=5.5.0-upgrade"
            echo "versionCode=96"
            echo "artifactType=UNSIGNED_RELEASE_CANDIDATE"
            echo "sourceCommit=$GITHUB_SHA"
            echo "sourceRef=$GITHUB_REF"
            echo "workflowRunId=$GITHUB_RUN_ID"
            echo "workflowRunAttempt=$GITHUB_RUN_ATTEMPT"
            echo "javaVersion=$(java -version 2>&1 | head -n 1)"
            echo "gradleVersion=$(./gradlew --version | awk '/^Gradle / {print $2; exit}')"
            echo "androidBuildTools=35.0.0"
            echo "sha256=$(sha256sum release-candidate/ALVISIA_PRO_5.5.0_RELEASE_CANDIDATE_UNSIGNED.apk | awk '{print $1}')"
          } > release-candidate/BUILD_PROVENANCE.txt
          unzip -Z1 release-candidate/*.apk | grep -Fx 'lib/arm64-v8a/librasp_guard.so'
          BASE_APK="release-candidate/ALVISIA_PRO_5.5.0_RELEASE_CANDIDATE_UNSIGNED.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$BASE_APK" > "$RUNNER_TEMP/alvisia-base-badging.txt"
          grep -F "name='com.alvsia.pro'" "$RUNNER_TEMP/alvisia-base-badging.txt"
          grep -F "versionCode='96'" "$RUNNER_TEMP/alvisia-base-badging.txt"
          grep -F "versionName='5.5.0-upgrade'" "$RUNNER_TEMP/alvisia-base-badging.txt"
          for entry in lib/arm64-v8a/librasp_guard.so lib/arm64-v8a/libchaquopy_java.so lib/arm64-v8a/libpython3.8.so; do
            unzip -Z1 "$BASE_APK" | grep -Fx "$entry" >/dev/null || { echo "::error::Required runtime library missing from base APK: $entry"; exit 1; }
          done
          echo "Base release gate passed: package/version and runtime-critical libraries verified."

      - name: Upload unsigned release candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALVISIA-PRO-5.5.0-RELEASE-CANDIDATE-UNSIGNED
          path: release-candidate/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ALVISIA-PRO-BUILD-DIAGNOSTICS
          path: |
            **/build/reports/**
            **/build/outputs/**
          if-no-files-found: ignore
          retention-days: 7

  # Build a sequential combined protection candidate: Obfuscapk output feeds XopProtector.
  # The ordinary unsigned build remains a recovery baseline; only the combined candidate
  # contains both post-build protectors. Device/runtime validation is required before release.
  protection-candidates:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download unsigned release candidate
        uses: actions/download-artifact@v4
        with:
          name: ALVISIA-PRO-5.5.0-RELEASE-CANDIDATE-UNSIGNED
          path: input

      - name: Prepare isolated workspaces
        run: |
          set -euo pipefail
          mkdir -p obfuscapk-work/apks obfuscapk-work/output xop-work candidates
          cp input/ALVISIA_PRO_5.5.0_RELEASE_CANDIDATE_UNSIGNED.apk obfuscapk-work/apks/base.apk
          cp input/ALVISIA_PRO_5.5.0_RELEASE_CANDIDATE_UNSIGNED.apk xop-work/base.apk

      - name: Run Obfuscapk on an isolated copy
        id: obfuscapk
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone https://github.com/Mobile-IoT-Security-Lab/Obfuscapk.git obfuscapk-src
          git -C obfuscapk-src checkout b1ed6d153566c5b070b02e98cfd04d081504a4bd
          docker build -t alvisia-obfuscapk obfuscapk-src
          docker run --rm \
            -v "$PWD/obfuscapk-work/apks:/workdir" \
            -v "$PWD/obfuscapk-work/output:/output" \
            alvisia-obfuscapk \
            -o ConstStringEncryption -o Rebuild -o NewAlignment -o NewSignature \
            --cleanup --output-dir /output /workdir/base.apk
          find obfuscapk-work/output -type f -name '*.apk' -size +0c -exec cp {} candidates/ALVISIA_OBFUSCAPK_CANDIDATE.apk \;

      - name: Set up JDK 17 for XopProtector
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # This job downloads artifacts but does not check out the Android project.
          # Gradle dependency caching requires a wrapper/build file and fails without one.
          # XopProtector has its own wrapper in xop-src and is built in its own step.

      - name: Set up Android SDK for XopProtector
        if: always()
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Validate Obfuscapk candidate identity and runtime libraries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/candidates/ALVISIA_OBFUSCAPK_CANDIDATE.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::warning::Obfuscapk produced no candidate; nothing to validate."
            exit 0
          fi
          BADGING="$RUNNER_TEMP/alvisia-obfuscapk-badging.txt"
          if ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$BADGING" ||
             ! grep -F "name='com.alvsia.pro'" "$BADGING" ||
             ! grep -F "versionCode='96'" "$BADGING" ||
             ! grep -F "versionName='5.5.0-upgrade'" "$BADGING" ||
             ! unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/librasp_guard.so' >/dev/null ||
             ! unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libchaquopy_java.so' >/dev/null ||
             ! unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libpython3.8.so' >/dev/null ||
             ! "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 26 "$APK"; then
            echo "::warning::Obfuscapk candidate failed static identity/library/signature checks; removing it from downloadable candidates."
            rm -f "$APK"
            exit 0
          fi
          echo "Obfuscapk candidate passed static identity, runtime-library and APK signature checks. Device compatibility remains unverified."

      - name: Run XopProtector on the Obfuscapk output (combined pipeline)
        id: xopprotector
        if: always()
        env:
          ALVISIA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ALVISIA_RELEASE_KEYSTORE_BASE64 }}
          ALVISIA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ALVISIA_RELEASE_KEYSTORE_PASSWORD }}
          ALVISIA_RELEASE_KEY_ALIAS: ${{ secrets.ALVISIA_RELEASE_KEY_ALIAS }}
          ALVISIA_RELEASE_KEY_PASSWORD: ${{ secrets.ALVISIA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          git clone https://github.com/xopJack/XopProtector.git xop-src
          git -C xop-src checkout 5990c3139542cca51271dadceab62e8731bbbf95
          # Linux CI must ignore any local UniMP SDK path inherited from Windows.
          # The upstream settings file supports skipping :unimp-host when SDK AARs
          # are unavailable; this build only needs the packer/native modules.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("xop-src/settings.gradle.kts")
          source = p.read_text()
          # Remove Windows drive paths robustly, regardless of slash direction or escaping.
          lines = source.splitlines()
          kept_settings = []
          removed = 0
          for line in lines:
              has_drive_path = re.search(r'(?i)[A-Z]:[\\\\/]', line) is not None
              mentions_sdk_libs = 'SDK' in line and 'libs' in line
              if has_drive_path and mentions_sdk_libs and ('file(' in line or 'libs' in line):
                  removed += 1
                  continue
              kept_settings.append(line)
          if removed:
              p.write_text(chr(10).join(kept_settings) + chr(10))
              print(f"Removed {removed} Windows-local SDK path candidate(s).")
          remaining = p.read_text()
          if re.search(r'(?i)[A-Z]:[\\\\/].*(?:SDK|\\\\SDK|/SDK).*(?:libs)', remaining):
              raise SystemExit("A Windows-local SDK path remains in settings.gradle.kts.")
          # Also override a machine-specific unimp.sdk.libs value from gradle.properties.
          gp = Path("xop-src/gradle.properties")
          if gp.exists():
              lines = gp.read_text().splitlines()
              kept = [line for line in lines if not re.match(r'\s*unimp\.sdk\.libs\s*=', line)]
              if kept != lines:
                  gp.write_text(chr(10).join(kept) + chr(10))
                  print("Removed machine-specific unimp.sdk.libs Gradle property.")
          PY
          cd xop-src
          chmod +x ./gradlew
          # Upstream may include a machine-local local.properties that overrides ANDROID_HOME.
          # Pin the SDK to the runner's installed Android SDK and verify d8 before Gradle runs.
          test -n "${ANDROID_HOME:-}"
          rm -f local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDK build-tools directories:"
          find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
          ./gradlew -Punimp.sdk.libs= :packer:jar exportShellFiles --no-daemon --stacktrace
          # Feed the validated Obfuscapk APK into XopProtector. Sign only this temporary input
          # with an ephemeral CI key; never use the production release keystore here.
          # Fail closed rather than silently publishing a one-protector candidate.
          OBFUS_APK="$GITHUB_WORKSPACE/candidates/ALVISIA_OBFUSCAPK_CANDIDATE.apk"
          if [[ ! -s "$OBFUS_APK" ]]; then
            echo "::error::Combined protection blocked: Obfuscapk did not produce a validated APK."
            exit 1
          fi
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/xop-ci-test.jks" \
            -storepass xop-ci-only -keypass xop-ci-only -alias xop-ci-test \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=ALVISIA CI Xop Test, OU=CI, O=ALVISIA PRO, C=ID"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/xop-ci-test.jks" --ks-key-alias xop-ci-test \
            --ks-pass pass:xop-ci-only --key-pass pass:xop-ci-only \
            --out "$GITHUB_WORKSPACE/xop-work/obfuscapk-signed.apk" \
            "$OBFUS_APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose --min-sdk-version 26 "$GITHUB_WORKSPACE/xop-work/obfuscapk-signed.apk"
          PACKER="$(find packer/build/libs -maxdepth 1 -type f -name 'protector-packer-*.jar' | head -n 1)"
          test -n "$PACKER"
          # Keep the app's JNI security anchor intact, but keep Xop SO protection
          # active for compatible libraries (including Chaquopy/Python). Xop's own
          # report must confirm librasp_guard.so is excluded from SO encryption.
          java -jar "$PACKER" "$GITHUB_WORKSPACE/xop-work/obfuscapk-signed.apk" \
            -o "$GITHUB_WORKSPACE/candidates/ALVISIA_COMBINED_OBFUSCAPK_XOPPROTECTOR_UNSIGNED.apk" \
            --shell-dir "$GITHUB_WORKSPACE/xop-src/executable/shell-files" \
            --profile balanced \
            --true-vmp-prefix Lcom/alvsia/pro/sec/ \
            --protect-so \
            --protect-so-mode max \
            --protect-so-exclude librasp_guard.so,libchaquopy_java.so,libpython3.8.so \
            2>&1 | tee "$RUNNER_TEMP/alvisia-xop-packer.log"
          # Do not claim Double VM unless the packer reports at least one admitted
          # and successfully transformed PVM2 method from ALVISIA security code.
          if ! grep -Eq 'PVM2 admission: candidates=[1-9][0-9]* attempted=[1-9][0-9]* success=[1-9][0-9]*' "$RUNNER_TEMP/alvisia-xop-packer.log"; then
            echo "::error::True-VMP/PVM2 produced no successful method transformations; combined candidate rejected."
            exit 1
          fi
          # The report is embedded in the APK, not emitted as a sidecar. Validate
          # that exact artifact and discard it if native protection is ineffective.
          python3 - <<'PY'
          import json, os, zipfile
          # This step runs while cwd is xop-src; inspect the workspace artifact by absolute path.
          apk = os.path.join(os.environ["GITHUB_WORKSPACE"], "candidates", "ALVISIA_COMBINED_OBFUSCAPK_XOPPROTECTOR_UNSIGNED.apk")
          try:
              with zipfile.ZipFile(apk) as zf:
                  report = json.loads(zf.read("assets/protector/size_report.json"))
              if report.get("protect_so") is not True:
                  raise RuntimeError("Xop SO protection is not active.")
              encrypted = report.get("so_encrypted", [])
              encrypted_names = {os.path.basename(item.get("path", "")) for item in encrypted}
              required_exclusions = {"librasp_guard.so", "libchaquopy_java.so", "libpython3.8.so"}
              violations = sorted(encrypted_names & required_exclusions)
              if violations:
                  raise RuntimeError("Xop encrypted runtime-critical libraries: " + ", ".join(violations))
              if not encrypted:
                  raise RuntimeError("Xop reported zero encrypted SO files; candidate is not eligible for testing.")
              print("Verified: Xop SO protection is enabled and encrypted compatible SO files; runtime-critical libraries remain excluded.")
          except Exception:
              if os.path.exists(apk):
                  os.remove(apk)
              raise
          PY
          # Prefer the ALVISIA production certificate when repository Actions secrets are configured.
          # Never print or upload keystore/password material. Otherwise publish only a clearly
          # test-signed candidate; it is not a production release and may fail the app cert pin.
          FINAL_APK="$GITHUB_WORKSPACE/candidates/ALVISIA_COMBINED_OBFUSCAPK_XOPPROTECTOR.apk"
          UNSIGNED_APK="$GITHUB_WORKSPACE/candidates/ALVISIA_COMBINED_OBFUSCAPK_XOPPROTECTOR_UNSIGNED.apk"
          if [[ -n "${ALVISIA_RELEASE_KEYSTORE_BASE64:-}" &&
                -n "${ALVISIA_RELEASE_KEYSTORE_PASSWORD:-}" &&
                -n "${ALVISIA_RELEASE_KEY_ALIAS:-}" &&
                -n "${ALVISIA_RELEASE_KEY_PASSWORD:-}" ]]; then
            KEYSTORE="$RUNNER_TEMP/alvisia-production-release.jks"
            printf '%s' "$ALVISIA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            # Try the dedicated private-key password first. Some valid JKS files use
            # the same password for the store and private key; fall back to the store
            # password only if the configured key password cannot recover the alias.
            if ! "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$KEYSTORE" --ks-key-alias "$ALVISIA_RELEASE_KEY_ALIAS" \
              --ks-pass env:ALVISIA_RELEASE_KEYSTORE_PASSWORD \
              --key-pass env:ALVISIA_RELEASE_KEY_PASSWORD \
              --out "$FINAL_APK" "$UNSIGNED_APK"; then
              rm -f "$FINAL_APK"
              echo "::warning::Configured private-key password failed; retrying with the keystore password without printing either secret."
              "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
                --ks "$KEYSTORE" --ks-key-alias "$ALVISIA_RELEASE_KEY_ALIAS" \
                --ks-pass env:ALVISIA_RELEASE_KEYSTORE_PASSWORD \
                --key-pass env:ALVISIA_RELEASE_KEYSTORE_PASSWORD \
                --out "$FINAL_APK" "$UNSIGNED_APK"
            fi
            CERTS="$RUNNER_TEMP/alvisia-production-certs.txt"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$FINAL_APK" > "$CERTS"
            if ! grep -qiF 'Signer #1 certificate SHA-256 digest: 99b33815c88a17abbcfe22be15250363f6dfc79c11ffc980e71b62b74b1f295c' "$CERTS"; then
              echo "::error::Production APK signer does not match the pinned ALVISIA certificate."
              rm -f "$FINAL_APK" "$KEYSTORE" "$CERTS"
              exit 1
            fi
            echo "Production certificate SHA-256 matches the pinned ALVISIA certificate."
            rm -f "$KEYSTORE" "$CERTS"
          else
            echo "::warning::Production signing secrets are not all configured; signing this candidate with the ephemeral CI test key only."
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$RUNNER_TEMP/xop-ci-test.jks" --ks-key-alias xop-ci-test \
              --ks-pass pass:xop-ci-only --key-pass pass:xop-ci-only \
              --out "$FINAL_APK" "$UNSIGNED_APK"
          fi
          rm -f "$UNSIGNED_APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose --min-sdk-version 26 "$FINAL_APK"
          # Static release gate: verify identity and runtime-critical libraries after BOTH protectors.
          FINAL_APK="$GITHUB_WORKSPACE/candidates/ALVISIA_COMBINED_OBFUSCAPK_XOPPROTECTOR.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL_APK" > "$RUNNER_TEMP/alvisia-badging.txt"
          grep -F "name='com.alvsia.pro'" "$RUNNER_TEMP/alvisia-badging.txt"
          grep -F "versionCode='96'" "$RUNNER_TEMP/alvisia-badging.txt"
          grep -F "versionName='5.5.0-upgrade'" "$RUNNER_TEMP/alvisia-badging.txt"
          for entry in lib/arm64-v8a/librasp_guard.so lib/arm64-v8a/libchaquopy_java.so lib/arm64-v8a/libpython3.8.so; do
            unzip -Z1 "$FINAL_APK" | grep -Fx "$entry" >/dev/null || { echo "::error::Required runtime library missing: $entry"; exit 1; }
          done
          python3 - "$FINAL_APK" <<'PY'
          import io, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = apk.namelist()
              for name in names:
                  if not name.endswith("/") and b"DECOY_NOT_ENGINE" in apk.read(name):
                      raise SystemExit("Release gate: decoy marker remains in APK entry " + name)
              nested = [n for n in names if n.endswith("assets/chaquopy/app.imy")]
              if len(nested) != 1:
                  raise SystemExit("Release gate: expected exactly one Chaquopy app.imy")
              with zipfile.ZipFile(io.BytesIO(apk.read(nested[0]))) as runtime:
                  for name in runtime.namelist():
                      if name.endswith("/"):
                          continue
                      data = runtime.read(name)
                      if b"DECOY_NOT_ENGINE" in data:
                          raise SystemExit("Release gate: decoy marker remains in app.imy:" + name)
                      if b"ALVISIA-20261010-MAIN-SEAL1" in data:
                          raise SystemExit("Release gate: build identity leaked into Python archive:" + name)
          PY
          READELF="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$READELF"
          RASP_SO="$RUNNER_TEMP/alvisia-librasp_guard.so"
          unzip -p "$FINAL_APK" lib/arm64-v8a/librasp_guard.so > "$RASP_SO"
          if "$READELF" --sections "$RASP_SO" | grep -E 'debug_(info|line|abbrev|str|loc|ranges)'; then
            echo "::error::Debug sections remain in final librasp_guard.so."
            exit 1
          fi
          rm -f "$RASP_SO"
          echo "Combined static gate passed: Obfuscapk then XopProtector; identity/version, decoy marker and native debug sections verified. Device runtime remains unverified."

      - name: Verify the single combined protection APK
        if: success()
        run: |
          set -euo pipefail
          FINAL_APK="candidates/ALVISIA_COMBINED_OBFUSCAPK_XOPPROTECTOR.apk"
          test -s "$FINAL_APK"
          sha256sum "$FINAL_APK"
          unzip -t "$FINAL_APK"
          # Do not package the intermediate Obfuscapk-only APK as a competing deliverable.
          rm -f candidates/ALVISIA_OBFUSCAPK_CANDIDATE.apk
          test "$(find candidates -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          ls -la candidates

      - name: Upload single combined protection APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ secrets.ALVISIA_RELEASE_KEYSTORE_BASE64 != '' && secrets.ALVISIA_RELEASE_KEYSTORE_PASSWORD != '' && secrets.ALVISIA_RELEASE_KEY_ALIAS != '' && secrets.ALVISIA_RELEASE_KEY_PASSWORD != '' && 'ALVISIA-PRO-5.5.0-COMBINED-PRODUCTION-SIGNED' || 'ALVISIA-PRO-5.5.0-COMBINED-TEST-SIGNED-NOT-FOR-RELEASE' }}
          path: candidates/ALVISIA_COMBINED_OBFUSCAPK_XOPPROTECTOR.apk
          if-no-files-found: error
          retention-days: 7

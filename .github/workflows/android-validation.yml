name: Android Security Validation
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate fresh per-build seal seed
        run: |
          SEED=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          echo "ALVSIA_SEAL_SEED_HEX=$SEED" >> $GITHUB_ENV
          echo "Seal seed length: ${#SEED}"

      - name: Run source-level security checks
        run: python3 tools/security_release_check.py

      - name: Run APK pre-build audit
        run: python3 tools/audit_release_apk.py --pre-build-check || true

      - name: Check no debug flags in manifest
        run: |
          if grep -q 'android:debuggable="true"' app/src/main/AndroidManifest.xml; then
            echo "FAIL: debuggable=true in manifest"; exit 1
          fi
          echo "OK: manifest clean"

      - name: Verify CERT_SHA256 in build config
        run: grep -q "CERT_SHA256" app/build.gradle.kts || (echo "FAIL" && exit 1)

      - name: Verify branch restriction
        run: |
          BRANCH="${GITHUB_REF_NAME:-}"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$BRANCH" != "main" ]; then
            echo "WARNING: push from non-main branch: $BRANCH"
          fi
          echo "Branch: $BRANCH"

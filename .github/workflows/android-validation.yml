name: Android Security Validation
on:
  push:
    branches: [ main, fix/chaquopy-python312-ci, release/5.5.2-19-module-redesign ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Chaquopy 15 host-side pip imports cgi, removed in Python 3.13+.
      # Pin the CI host interpreter; embedded app Python remains set in app/build.gradle.kts.
      - name: Set up compatible host Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify host Python version
        run: python3 --version

      - name: Generate fresh per-build seal seed
        run: |
          SEED=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          echo "::add-mask::$SEED"
          echo "ALVSIA_SEAL_SEED_HEX=$SEED" >> "$GITHUB_ENV"
          echo "Seal seed generated (32 bytes); value is masked."

      - name: Run source-level security checks
        run: python3 tools/security_release_check.py

      - name: Verify security protections are wired into runtime
        run: python3 -m unittest tests.test_security_wiring

      - name: Verify active Unaux Python TLS pin policy
        run: python3 -m unittest discover -s tests -p 'test_pinned_http.py'

      - name: Compile Python tool modules and run dispatch contract tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          modules = (
              "app/src/main/python/alvsia_bridge.py",
              "app/src/main/python/alvsia_bridge_impl.py",
              "app/src/main/python/alvsia_core.py",
              "app/src/main/python/alvsia_features.py",
              "app/src/main/python/alvsia_ultimate.py",
              "app/src/main/python/alvsia_vm_protect.py",
              "app/src/main/python/alvsia_private.py",
              "app/src/main/python/sealed_loader.py",
          )
          for name in modules:
              compile(Path(name).read_text(encoding="utf-8"), name, "exec")
          print("PYTHON SYNTAX CHECK: PASS")
          PY
          python3 tests/test_tool_dispatch.py
          python3 -m unittest tests.test_private_tool_engine

      - name: Run sealed payload cryptographic tests
        run: |
          python3 -m pip install --disable-pip-version-check cryptography
          python3 tests/test_seal_python_payloads.py

      - name: Run Lua decompiler safety regression tests
        run: |
          python3 -m pip install --disable-pip-version-check pycryptodome
          python3 -m unittest discover -s tests -p 'test_lua*.py'

      - name: Run Lua Protector round-trip tests
        run: python3 tests/test_vm_protect_roundtrip.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"

      - name: Build and test Android debug variant
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare sealed release inputs
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography
          python3 tools/seal_python.py --seal
          python3 tools/seal_assets.py
          test ! -e app/src/main/assets/unluac/unluac.jar

      - name: Inject per-build seed into native library source
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          seed = os.environ.get("ALVSIA_SEAL_SEED_HEX", "")
          if len(seed) != 64 or any(c not in "0123456789abcdefABCDEF" for c in seed):
              raise SystemExit("Invalid per-build seal seed")
          path = Path("app/src/main/cpp/rasp_guard.cpp")
          source = path.read_text()
          old = "static const unsigned char _alvsia_seal_seed[32] = {0};"
          values = ", ".join("0x" + seed[i:i+2] for i in range(0, 64, 2))
          if source.count(old) != 1:
              raise SystemExit("Native seed placeholder missing or ambiguous")
          path.write_text(source.replace(old, "static const unsigned char _alvsia_seal_seed[32] = {" + values + "};"))
          PY

      - name: Build release APK
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          # Strip non-runtime metadata and the plaintext rebrand template before auditing.
          python3 tools/strip_vcs_metadata.py "$APK"
          python3 tools/audit_release_apk.py "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT" || { echo "FAIL: aapt not found"; exit 1; }
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.alvsia.pro' versionCode='98' versionName='5.5.2-hardened'" || {
            echo "FAIL: APK package/version does not match release source"
            printf '%s\n' "$BADGING" | grep -E "^package:|^application-label:" || true
            exit 1
          }
          echo "PASS: APK package/version verified"
          mkdir -p validation-artifacts
          cp "$APK" validation-artifacts/ALVISIA_PRO_5.5.2-hardened_release_unsigned.apk
          cp release_security_audit.txt validation-artifacts/
          sha256sum validation-artifacts/*.apk

      - name: Build XopProtector candidate for ReArk handoff
        run: |
          set -euo pipefail
          BASE_APK="validation-artifacts/ALVISIA_PRO_5.5.2-hardened_release_unsigned.apk"
          test -s "$BASE_APK"
          XOP_DIR="$RUNNER_TEMP/xopprotector-src"
          rm -rf "$XOP_DIR"
          git clone --filter=blob:none https://github.com/xopJack/XopProtector.git "$XOP_DIR"
          git -C "$XOP_DIR" checkout --detach 5990c31
          # Disable optional machine-specific UniMP SDK lookup in upstream settings.
          python3 - "$XOP_DIR/settings.gradle.kts" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          start = s.find("val unimpLibsProp =")
          if start < 0:
              raise SystemExit("ERROR: expected unimpLibsProp block not found; refusing unknown upstream layout")
          # This block is the final section of settings.gradle.kts at the pinned upstream commit.
          # Drop the entire optional UniMP host section, including its machine-specific warning text.
          s = s[:start] + '// Optional UniMP host omitted in CI: the packer does not require its local SDK AARs.\n'
          p.write_text(s)
          check = p.read_text()
          if "unimpLibsProp" in check or "unimp.sdk.libs" in check or "E:/Android/" in check:
              raise SystemExit("ERROR: machine-specific SDK lookup remains")
          print("PASS: optional machine-specific UniMP SDK lookup removed")
          PY
          chmod +x "$XOP_DIR/gradlew"
          (cd "$XOP_DIR" && ./gradlew --no-daemon :packer:jar exportShellFiles)
          PACKER_JAR="$(find "$XOP_DIR/packer/build/libs" -maxdepth 1 -type f -name 'protector-packer-*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$PACKER_JAR" && test -s "$PACKER_JAR"
          test -d "$XOP_DIR/executable/shell-files"
          CANDIDATE="$RUNNER_TEMP/ALVISIA_PRO_5.5.2-xop_candidate_unsigned.apk"
          java -jar "$XOP_DIR/$PACKER_JAR" "$BASE_APK" \
            -o "$CANDIDATE" \
            --shell-dir "$XOP_DIR/executable/shell-files" \
            --profile industry \
            --protect-so
          test -s "$CANDIDATE"
          python3 - "$BASE_APK" "$CANDIDATE" <<'PY'
          import sys, zipfile
          base, candidate = sys.argv[1:3]
          base_required = {"lib/arm64-v8a/librasp_guard.so", "assets/chaquopy/app.imy", "assets/nx/i.dat"}
          candidate_required = base_required | {"lib/arm64-v8a/libprotector.so", "assets/protector/dexes.zip"}
          with zipfile.ZipFile(base) as a, zipfile.ZipFile(candidate) as b:
              for label, z, required in (("baseline", a, base_required), ("Xop candidate", b, candidate_required)):
                  missing = sorted(required - set(z.namelist()))
                  if missing:
                      raise SystemExit(f"{label} missing required entries: {missing}")
                  if z.testzip() is not None:
                      raise SystemExit(f"{label} ZIP integrity check failed")
          print("PASS: ZIP integrity, Chaquopy payload, RASP library and Xop DEX container")
          PY
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          BASE_BADGING="$("$AAPT" dump badging "$BASE_APK" | grep '^package:' | head -n 1)"
          CAND_BADGING="$("$AAPT" dump badging "$CANDIDATE" | grep '^package:' | head -n 1)"
          test -n "$BASE_BADGING" && test "$BASE_BADGING" = "$CAND_BADGING" || { echo "ERROR: package/version changed"; exit 1; }
          BASE_PERMS="$("$AAPT" dump permissions "$BASE_APK" | sort)"
          CAND_PERMS="$("$AAPT" dump permissions "$CANDIDATE" | sort)"
          test "$BASE_PERMS" = "$CAND_PERMS" || { echo "ERROR: manifest permission set changed"; diff -u <(printf '%s\n' "$BASE_PERMS") <(printf '%s\n' "$CAND_PERMS") || true; exit 1; }
          python3 tools/audit_release_apk.py "$CANDIDATE"
          cp release_security_audit.txt validation-artifacts/xop_candidate_security_audit.txt
          cp "$CANDIDATE" validation-artifacts/ALVISIA_PRO_5.5.2-xop_candidate_unsigned.apk
          sha256sum validation-artifacts/ALVISIA_PRO_5.5.2-xop_candidate_unsigned.apk
          echo "PASS: unsigned XopProtector candidate ready for ReArk handoff; device/ReArk runtime testing still required."

      - name: Report release APK fingerprint and size
        run: |
          set -euo pipefail
          APK=validation-artifacts/ALVISIA_PRO_5.5.2-hardened_release_unsigned.apk
          test -s "$APK"
          echo "Commit: $GITHUB_SHA"
          echo "APK bytes: $(wc -c < "$APK" | tr -d ' ')"
          echo "APK SHA-256: $(sha256sum "$APK" | awk '{print $1}')"

      - name: Publish private draft validation release (avoids Actions artifact quota)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alvsia-validation-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ALVISIA PRO validation build ${{ github.run_number }}
          draft: true
          prerelease: true
          # Publish one APK only: the XopProtector candidate for the ReArk handoff.
          # The baseline APK is an internal CI input and is not attached to the release.
          files: |
            validation-artifacts/ALVISIA_PRO_5.5.2-xop_candidate_unsigned.apk
            validation-artifacts/xop_candidate_security_audit.txt
          fail_on_unmatched_files: true

      - name: Restore source files after sealed build
        if: always()
        run: python3 tools/seal_python.py --restore

      - name: Check no debug flags in manifest
        run: |
          if grep -q 'android:debuggable="true"' app/src/main/AndroidManifest.xml; then
            echo "FAIL: debuggable=true in manifest"; exit 1
          fi
          echo "OK: manifest clean"

      - name: Verify CERT_SHA256 in build config
        run: grep -q "CERT_SHA256" app/build.gradle.kts || (echo "FAIL" && exit 1)

      - name: Verify branch restriction
        run: |
          BRANCH="${GITHUB_REF_NAME:-}"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$BRANCH" != "main" ]; then
            echo "WARNING: push from non-main branch: $BRANCH"
          fi
          echo "Branch: $BRANCH"

      - name: Send STEALTH Telegram build report
        if: always()
        timeout-minutes: 1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          python3 - <<'PY'
          import html, json, os, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat:
              print("SKIP: Telegram secrets are not configured; build result remains unchanged.")
              raise SystemExit(0)
          status = os.environ.get("JOB_STATUS", "unknown").upper()
          icon = "🟢" if status == "SUCCESS" else "🔴" if status == "FAILURE" else "🟠"
          esc = lambda s: html.escape(s, quote=True)
          repo = os.environ.get("REPOSITORY", "unknown")
          ref = os.environ.get("REF_NAME", "unknown")
          sha = os.environ.get("COMMIT_SHA", "")[:12]
          workflow = os.environ.get("WORKFLOW_NAME", "Android validation")
          run_url = os.environ.get("RUN_URL", "")
          message = (
              "<b>⟦ ALVISIA PRO // STEALTH BUILD INTEL ⟧</b>\n"
              "━━━━━━━━━━━━━━━━━━\n"
              f"{icon} <b>STATUS:</b> <code>{esc(status)}</code>\n"
              f"🛰 <b>PIPELINE:</b> <code>{esc(workflow)}</code>\n"
              f"📦 <b>REPOSITORY:</b> <code>{esc(repo)}</code>\n"
              f"🌿 <b>BRANCH:</b> <code>{esc(ref)}</code>\n"
              f"🔏 <b>COMMIT:</b> <code>{esc(sha)}</code>\n"
              "━━━━━━━━━━━━━━━━━━\n"
              f'🔎 <a href="{esc(run_url)}">OPEN BUILD LOG</a>\n'
              "<i>ALVISIA // AUTOMATED CI REPORT</i>"
          )
          payload = json.dumps({
              "chat_id": chat,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }).encode()
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  data = json.loads(response.read().decode("utf-8"))
              if not data.get("ok"):
                  raise SystemExit("Telegram API rejected the build report")
              print("PASS: STEALTH Telegram build report delivered")
          except Exception as exc:
              print(f"WARNING: Telegram report delivery failed: {type(exc).__name__}: {exc}")
              # Notification failure must not mask the real build result.
          PY

name: ALVISIA PRO Android Release Build

on:
  push:
    branches: [main, 'security/vanta-audit-50-layer-20261013']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alvisia-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Verify source and wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f app/build.gradle.kts
          chmod +x ./gradlew
          python -m pip install --disable-pip-version-check pycryptodome
          python -m unittest discover -s tests -v
          python -m compileall -q app/src/main/python scripts
          java -version
          ./gradlew --version

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          # Generate a unique per-build seed so native code and this build share it.
          export ALVSIA_SEAL_SEED_HEX="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$ALVSIA_SEAL_SEED_HEX"
          ./gradlew clean resguardRelease --stacktrace --no-daemon
          APK="$(find app/build/outputs -type f -name '*.apk' -size +0c | grep -E 'release|andresguard' | head -n 1 || true)"
          if [[ -z "$APK" ]]; then
            echo "::error::Gradle finished without a release APK. Inspect the Gradle output above."
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          mkdir -p release-candidate
          cp "$APK" release-candidate/ALVISIA_PRO_5.5.0_RELEASE_CANDIDATE_UNSIGNED.apk
          sha256sum release-candidate/*.apk | tee release-candidate/SHA256SUMS.txt
          unzip -Z1 release-candidate/*.apk | grep -Fx 'lib/arm64-v8a/librasp_guard.so'

      - name: Upload unsigned release candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALVISIA-PRO-5.5.0-RELEASE-CANDIDATE-UNSIGNED
          path: release-candidate/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ALVISIA-PRO-BUILD-DIAGNOSTICS
          path: |
            **/build/reports/**
            **/build/outputs/**
          if-no-files-found: ignore
          retention-days: 7

  # Experimental post-build protectors run on separate copies of the unsigned APK.
  # Their output is diagnostic only and is never promoted to the release artifact.
  protection-candidates:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download unsigned release candidate
        uses: actions/download-artifact@v4
        with:
          name: ALVISIA-PRO-5.5.0-RELEASE-CANDIDATE-UNSIGNED
          path: input

      - name: Prepare isolated workspaces
        run: |
          set -euo pipefail
          mkdir -p obfuscapk-work/apks obfuscapk-work/output xop-work candidates
          cp input/ALVISIA_PRO_5.5.0_RELEASE_CANDIDATE_UNSIGNED.apk obfuscapk-work/apks/base.apk
          cp input/ALVISIA_PRO_5.5.0_RELEASE_CANDIDATE_UNSIGNED.apk xop-work/base.apk

      - name: Run Obfuscapk on an isolated copy
        id: obfuscapk
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone https://github.com/Mobile-IoT-Security-Lab/Obfuscapk.git obfuscapk-src
          git -C obfuscapk-src checkout b1ed6d153566c5b070b02e98cfd04d081504a4bd
          docker build -t alvisia-obfuscapk obfuscapk-src
          docker run --rm \
            -v "$PWD/obfuscapk-work/apks:/workdir" \
            -v "$PWD/obfuscapk-work/output:/output" \
            alvisia-obfuscapk \
            -o ConstStringEncryption -o Rebuild -o NewAlignment -o NewSignature \
            --cleanup --output-dir /output /workdir/base.apk
          find obfuscapk-work/output -type f -name '*.apk' -size +0c -exec cp {} candidates/ALVISIA_OBFUSCAPK_CANDIDATE.apk \;

      - name: Set up JDK 17 for XopProtector
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # This job downloads artifacts but does not check out the Android project.
          # Gradle dependency caching requires a wrapper/build file and fails without one.
          # XopProtector has its own wrapper in xop-src and is built in its own step.

      - name: Set up Android SDK for XopProtector
        if: always()
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Run XopProtector on a separate isolated copy
        id: xopprotector
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone https://github.com/xopJack/XopProtector.git xop-src
          git -C xop-src checkout 5990c3139542cca51271dadceab62e8731bbbf95
          # Linux CI must ignore any local UniMP SDK path inherited from Windows.
          # The upstream settings file supports skipping :unimp-host when SDK AARs
          # are unavailable; this build only needs the packer/native modules.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("xop-src/settings.gradle.kts")
          source = p.read_text()
          # Drop any hard-coded Windows drive path that points at a local SDK/libs directory.
          pattern = r'(?m)^\s*file\(["\'][A-Za-z]:[/\\\\].*?SDK[/\\\\]libs["\']\),?\s*\n'
          patched, count = re.subn(pattern, "", source)
          if count:
              p.write_text(patched)
              print(f"Removed {count} Windows-local SDK path candidate(s).")
          if re.search(r'[A-Za-z]:[/\\\\].*?SDK[/\\\\]libs', p.read_text()):
              raise SystemExit("A Windows-local SDK path remains in settings.gradle.kts.")
          # Also override a machine-specific unimp.sdk.libs value from gradle.properties.
          gp = Path("xop-src/gradle.properties")
          if gp.exists():
              lines = gp.read_text().splitlines()
              kept = [line for line in lines if not re.match(r'\s*unimp\.sdk\.libs\s*=', line)]
              if kept != lines:
                  gp.write_text(chr(10).join(kept) + chr(10))
                  print("Removed machine-specific unimp.sdk.libs Gradle property.")
          PY
          cd xop-src
          chmod +x ./gradlew
          ./gradlew -Punimp.sdk.libs= :packer:jar exportShellFiles --no-daemon
          PACKER="$(find packer/build/libs -maxdepth 1 -type f -name 'protector-packer-*.jar' | head -n 1)"
          test -n "$PACKER"
          java -jar "$PACKER" "$GITHUB_WORKSPACE/xop-work/base.apk" \
            -o "$GITHUB_WORKSPACE/candidates/ALVISIA_XOPPROTECTOR_CANDIDATE.apk" \
            --shell-dir "$GITHUB_WORKSPACE/xop-src/executable/shell-files" \
            --profile balanced --protect-so

      - name: Verify and upload protector candidates
        if: always()
        run: |
          set -euo pipefail
          for apk in candidates/*.apk; do
            [ -s "$apk" ] || continue
            echo "===== $(basename "$apk") ====="
            sha256sum "$apk"
            unzip -t "$apk"
          done
          ls -la candidates

      - name: Upload experimental protection candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALVISIA-PRO-5.5.0-PROTECTION-CANDIDATES
          path: candidates/*.apk
          if-no-files-found: warn
          retention-days: 7

name: Android Security Validation
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate fresh per-build seal seed
        run: |
          SEED=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          echo "ALVSIA_SEAL_SEED_HEX=$SEED" >> $GITHUB_ENV
          echo "Seal seed length: ${#SEED}"

      - name: Run source-level security checks
        run: python3 tools/security_release_check.py

      - name: Compile Python tool modules and run dispatch contract tests
        run: |
          python3 -m py_compile \
            app/src/main/python/alvsia_bridge.py \
            app/src/main/python/alvsia_bridge_impl.py \
            app/src/main/python/alvsia_core.py \
            app/src/main/python/alvsia_features.py \
            app/src/main/python/alvsia_ultimate.py \
            app/src/main/python/alvsia_vm_protect.py \
            app/src/main/python/sealed_loader.py
          python3 tests/test_tool_dispatch.py

      - name: Run sealed payload cryptographic tests
        run: |
          python3 -m pip install --disable-pip-version-check cryptography
          python3 tests/test_seal_python_payloads.py

      - name: Run Lua decompiler safety regression tests
        run: python3 -m unittest discover -s tests -p 'test_lua*.py'

      - name: Run Lua Protector round-trip tests
        run: python3 tests/test_vm_protect_roundtrip.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test Android debug variant
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare sealed release inputs
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography
          python3 tools/seal_python.py --seal
          python3 tools/seal_assets.py
          test ! -e app/src/main/assets/unluac/unluac.jar

      - name: Inject per-build seed into native library source
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          seed = os.environ.get("ALVSIA_SEAL_SEED_HEX", "")
          if len(seed) != 64 or any(c not in "0123456789abcdefABCDEF" for c in seed):
              raise SystemExit("Invalid per-build seal seed")
          path = Path("app/src/main/cpp/rasp_guard.cpp")
          source = path.read_text()
          old = "static const unsigned char _alvsia_seal_seed[32] = {0};"
          values = ", ".join("0x" + seed[i:i+2] for i in range(0, 64, 2))
          if source.count(old) != 1:
              raise SystemExit("Native seed placeholder missing or ambiguous")
          path.write_text(source.replace(old, "static const unsigned char _alvsia_seal_seed[32] = {" + values + "};"))
          PY

      - name: Build release APK
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          # Strip generated VCS metadata before auditing the unsigned APK.
          python3 - "$APK" <<'PY'
          import os, sys, zipfile
          from pathlib import Path
          apk = Path(sys.argv[1])
          tmp = apk.with_suffix(".stripped.apk")
          with zipfile.ZipFile(apk, "r") as src, zipfile.ZipFile(tmp, "w") as dst:
              dst.comment = src.comment
              for item in src.infolist():
                  if item.filename.endswith("version-control-info.textproto"):
                      continue
                  dst.writestr(item, src.read(item.filename))
          os.replace(tmp, apk)
          PY
          python3 tools/audit_release_apk.py "$APK"
          mkdir -p validation-artifacts
          cp "$APK" validation-artifacts/ALVISIA_PRO_5.5.0_release_unsigned.apk
          cp release_security_audit.txt validation-artifacts/
          sha256sum validation-artifacts/*.apk

      - name: Report release APK fingerprint and size
        run: |
          set -euo pipefail
          APK=validation-artifacts/ALVISIA_PRO_5.5.0_release_unsigned.apk
          test -s "$APK"
          echo "Commit: $GITHUB_SHA"
          echo "APK bytes: $(wc -c < "$APK" | tr -d ' ')"
          echo "APK SHA-256: $(sha256sum "$APK" | awk '{print $1}')"

      - name: Publish private draft validation release (avoids Actions artifact quota)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alvsia-validation-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ALVISIA PRO validation build ${{ github.run_number }}
          draft: true
          prerelease: true
          files: |
            validation-artifacts/ALVISIA_PRO_5.5.0_release_unsigned.apk
            validation-artifacts/release_security_audit.txt
          fail_on_unmatched_files: true

      - name: Restore source files after sealed build
        if: always()
        run: python3 tools/seal_python.py --restore

      - name: Check no debug flags in manifest
        run: |
          if grep -q 'android:debuggable="true"' app/src/main/AndroidManifest.xml; then
            echo "FAIL: debuggable=true in manifest"; exit 1
          fi
          echo "OK: manifest clean"

      - name: Verify CERT_SHA256 in build config
        run: grep -q "CERT_SHA256" app/build.gradle.kts || (echo "FAIL" && exit 1)

      - name: Verify branch restriction
        run: |
          BRANCH="${GITHUB_REF_NAME:-}"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$BRANCH" != "main" ]; then
            echo "WARNING: push from non-main branch: $BRANCH"
          fi
          echo "Branch: $BRANCH"

      - name: Send STEALTH Telegram build report
        if: always()
        timeout-minutes: 1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          python3 - <<'PY'
          import html, json, os, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat:
              print("SKIP: Telegram secrets are not configured; build result remains unchanged.")
              raise SystemExit(0)
          status = os.environ.get("JOB_STATUS", "unknown").upper()
          icon = "🟢" if status == "SUCCESS" else "🔴" if status == "FAILURE" else "🟠"
          esc = lambda s: html.escape(s, quote=True)
          repo = os.environ.get("REPOSITORY", "unknown")
          ref = os.environ.get("REF_NAME", "unknown")
          sha = os.environ.get("COMMIT_SHA", "")[:12]
          workflow = os.environ.get("WORKFLOW_NAME", "Android validation")
          run_url = os.environ.get("RUN_URL", "")
          message = (
              "<b>⟦ ALVISIA PRO // STEALTH BUILD INTEL ⟧</b>\n"
              "━━━━━━━━━━━━━━━━━━\n"
              f"{icon} <b>STATUS:</b> <code>{esc(status)}</code>\n"
              f"🛰 <b>PIPELINE:</b> <code>{esc(workflow)}</code>\n"
              f"📦 <b>REPOSITORY:</b> <code>{esc(repo)}</code>\n"
              f"🌿 <b>BRANCH:</b> <code>{esc(ref)}</code>\n"
              f"🔏 <b>COMMIT:</b> <code>{esc(sha)}</code>\n"
              "━━━━━━━━━━━━━━━━━━\n"
              f'🔎 <a href="{esc(run_url)}">OPEN BUILD LOG</a>\n'
              "<i>ALVISIA // AUTOMATED CI REPORT</i>"
          )
          payload = json.dumps({
              "chat_id": chat,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }).encode()
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  data = json.loads(response.read().decode("utf-8"))
              if not data.get("ok"):
                  raise SystemExit("Telegram API rejected the build report")
              print("PASS: STEALTH Telegram build report delivered")
          except Exception as exc:
              print(f"WARNING: Telegram report delivery failed: {type(exc).__name__}: {exc}")
              # Notification failure must not mask the real build result.
          PY

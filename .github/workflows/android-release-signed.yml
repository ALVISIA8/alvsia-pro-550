name: ALVSIA PRO — Signed Android Release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - '.github/workflows/android-release-signed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alvsia-pro-signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-verify:
    name: Build, sign, audit and verify APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ALVSIA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ALVSIA_RELEASE_KEYSTORE_BASE64 }}
      ALVSIA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ALVISIA_RELEASE_KEYSTORE_PASSWORD }}
      ALVSIA_RELEASE_KEY_ALIAS: ${{ secrets.ALVISIA_RELEASE_KEY_ALIAS }}
      ALVSIA_RELEASE_KEY_PASSWORD: ${{ secrets.ALVISIA_RELEASE_KEY_PASSWORD }}
      PACKAGE_NAME: com.alvsia.pro

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK, NDK and CMake packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No Android sdkmanager found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Validate signing secrets and release source
        shell: bash
        run: |
          set -euo pipefail
          : "${ALVSIA_RELEASE_KEYSTORE_BASE64:?Missing GitHub Actions secret ALVSIA_RELEASE_KEYSTORE_BASE64}"
          : "${ALVSIA_RELEASE_KEYSTORE_PASSWORD:?Missing GitHub Actions secret ALVSIA_RELEASE_KEYSTORE_PASSWORD}"
          : "${ALVSIA_RELEASE_KEY_ALIAS:?Missing GitHub Actions secret ALVSIA_RELEASE_KEY_ALIAS}"
          : "${ALVSIA_RELEASE_KEY_PASSWORD:?Missing GitHub Actions secret ALVSIA_RELEASE_KEY_PASSWORD}"
          grep -q 'CERT_SHA256' app/build.gradle.kts
          grep -q 'versionCode = 98' app/build.gradle.kts
          grep -q 'versionName = "5.5.2-hardened"' app/build.gradle.kts
          echo "PASS: required signing secrets are present (values are not printed)"
          java -version
          chmod +x ./gradlew

      - name: Generate per-build seal seed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import secrets
          seed = secrets.token_hex(32)
          print("::add-mask::" + seed)
          print("ALVSIA_SEAL_SEED_HEX=" + seed)
          PY
          echo "PASS: unique release seal seed generated"

      - name: Install Python audit dependency
        run: python3 -m pip install --user --disable-pip-version-check cryptography

      - name: Run source security checks
        run: python3 tools/security_release_check.py

      - name: Seal Python modules
        run: python3 tools/seal_python.py --seal

      - name: Seal runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/seal_assets.py
          if [ -e app/src/main/assets/unluac/unluac.jar ]; then
            echo "FAIL: plaintext unluac.jar remains after asset sealing"
            exit 1
          fi

      - name: Inject release seal seed into native guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          seed = os.environ.get("ALVSIA_SEAL_SEED_HEX", "")
          if len(seed) != 64 or any(c not in "0123456789abcdefABCDEF" for c in seed):
              raise SystemExit("Invalid release seal seed")
          values = ", ".join("0x" + seed[i:i+2] for i in range(0, 64, 2))
          path = Path("app/src/main/cpp/rasp_guard.cpp")
          source = path.read_text()
          old = "static const unsigned char _alvsia_seal_seed[32] = {0};"
          if source.count(old) != 1:
              raise SystemExit("Native seal seed placeholder missing or ambiguous")
          path.write_text(source.replace(old, "static const unsigned char _alvsia_seal_seed[32] = {" + values + "};"))
          print("PASS: native release seal seed injected")
          PY

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build_full.log
          test -d app/build/outputs/apk/release
          find app/build/outputs/apk/release -type f -name '*.apk' -print -quit | grep -q .

      - name: Strip VCS metadata and audit unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          python3 tools/strip_vcs_metadata.py "$APK"
          python3 tools/audit_release_apk.py "$APK"
          python3 tools/audit_release_metadata.py "$APK"

      - name: Restore sealed Python sources in workspace
        if: always()
        run: python3 tools/seal_python.py --restore || true

      - name: Align, sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -s "$UNSIGNED"

          KS="$RUNNER_TEMP/alvsia-release.keystore"
          python3 - "$KS" <<'PY'
          import base64, os, sys
          raw = "".join(os.environ["ALVSIA_RELEASE_KEYSTORE_BASE64"].split())
          try:
              data = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit("ALVSIA_RELEASE_KEYSTORE_BASE64 is not valid base64") from exc
          if not data:
              raise SystemExit("Decoded keystore is empty")
          with open(sys.argv[1], "wb") as f:
              f.write(data)
          os.chmod(sys.argv[1], 0o600)
          PY

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          SIGNED_APK="$GITHUB_WORKSPACE/ALVSIA_PRO_5.5.2-hardened_signed.apk"

          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" "$RUNNER_TEMP/alvsia-release-aligned.apk"
          # Validate the configured key password first; if this keystore uses the
          # store password for its private key too, retry without exposing secrets.
          if ! "$BUILD_TOOLS/apksigner" sign \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --ks "$KS" \
            --ks-key-alias "$ALVSIA_RELEASE_KEY_ALIAS" \
            --ks-pass "pass:$ALVSIA_RELEASE_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ALVSIA_RELEASE_KEY_PASSWORD" \
            --out "$SIGNED_APK" "$RUNNER_TEMP/alvsia-release-aligned.apk"; then
            rm -f "$SIGNED_APK"
            echo "Configured private-key password failed; trying keystore password for the private key."
            "$BUILD_TOOLS/apksigner" sign \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --ks "$KS" \
              --ks-key-alias "$ALVSIA_RELEASE_KEY_ALIAS" \
              --ks-pass "pass:$ALVSIA_RELEASE_KEYSTORE_PASSWORD" \
              --key-pass "pass:$ALVSIA_RELEASE_KEYSTORE_PASSWORD" \
              --out "$SIGNED_APK" "$RUNNER_TEMP/alvsia-release-aligned.apk"
          fi

          VERIFY_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK")"
          printf '%s\n' "$VERIFY_OUTPUT"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Eqi 'Verified using v1 scheme.*: true'
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Eqi 'Verified using v2 scheme.*: true'
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Eqi 'Verified using v3 scheme.*: true'

          EXPECTED_CERT_SHA256="$(grep 'CERT_SHA256' app/build.gradle.kts | grep -oE '[0-9a-fA-F]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          ACTUAL_CERT_SHA256="$("$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED_APK" | awk -F': ' '/certificate SHA-256 digest/ {gsub(":", "", $NF); print tolower($NF); exit}')"
          test -n "$EXPECTED_CERT_SHA256"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "FAIL: signing certificate does not match CERT_SHA256 pin"
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT_SHA256"
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -c -v 4 "$SIGNED_APK"
          python3 tools/audit_release_apk.py "$SIGNED_APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$SIGNED_APK")"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.alvsia.pro' versionCode='98' versionName='5.5.2-hardened'"
          sha256sum "$SIGNED_APK" | tee "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          echo "PASS: signed APK, v2/v3 signatures, certificate pin, zip alignment, package and version verified"
          rm -f "$KS"

      - name: Upload signed release APK and audit logs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALVSIA_PRO_5.5.2-hardened-signed
          if-no-files-found: error
          retention-days: 14
          path: |
            ALVSIA_PRO_5.5.2-hardened_signed.apk
            SHA256SUMS.txt
            build_full.log

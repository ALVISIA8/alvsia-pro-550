name: ALVSIA PRO — Signed Android Release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - '.github/workflows/android-release-signed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alvsia-pro-signed-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-sign-verify:
    name: Build, sign, audit and verify APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ALVSIA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ALVSIA_RELEASE_KEYSTORE_BASE64 }}
      ALVSIA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ALVISIA_RELEASE_KEYSTORE_PASSWORD }}
      ALVSIA_RELEASE_KEY_ALIAS: ${{ secrets.ALVISIA_RELEASE_KEY_ALIAS }}
      ALVSIA_RELEASE_KEY_PASSWORD: ${{ secrets.ALVISIA_RELEASE_KEY_PASSWORD }}
      PACKAGE_NAME: com.alvsia.pro

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK, NDK and CMake packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No Android sdkmanager found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Validate signing secrets and release source
        shell: bash
        run: |
          set -euo pipefail
          : "${ALVSIA_RELEASE_KEYSTORE_BASE64:?Missing GitHub Actions secret ALVSIA_RELEASE_KEYSTORE_BASE64}"
          : "${ALVSIA_RELEASE_KEYSTORE_PASSWORD:?Missing GitHub Actions secret ALVSIA_RELEASE_KEYSTORE_PASSWORD}"
          : "${ALVSIA_RELEASE_KEY_ALIAS:?Missing GitHub Actions secret ALVSIA_RELEASE_KEY_ALIAS}"
          : "${ALVSIA_RELEASE_KEY_PASSWORD:?Missing GitHub Actions secret ALVSIA_RELEASE_KEY_PASSWORD}"
          grep -q 'CERT_SHA256' app/build.gradle.kts
          grep -q 'versionCode = 98' app/build.gradle.kts
          grep -q 'versionName = "5.5.2-hardened"' app/build.gradle.kts
          echo "PASS: required signing secrets are present (values are not printed)"
          java -version
          chmod +x ./gradlew

      - name: Generate per-build seal seed
        shell: bash
        run: |
          set -euo pipefail
          SEED="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$SEED"
          printf 'ALVSIA_SEAL_SEED_HEX=%s\n' "$SEED" >> "$GITHUB_ENV"
          unset SEED
          echo "PASS: unique release seal seed generated and masked"

      - name: Install Python audit dependency
        run: python3 -m pip install --user --disable-pip-version-check cryptography

      - name: Run source security checks
        run: python3 tools/security_release_check.py

      - name: Seal Python modules
        run: python3 tools/seal_python.py --seal

      - name: Seal runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/seal_assets.py
          if [ -e app/src/main/assets/unluac/unluac.jar ]; then
            echo "FAIL: plaintext unluac.jar remains after asset sealing"
            exit 1
          fi

      - name: Inject release seal seed into native guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          seed = os.environ.get("ALVSIA_SEAL_SEED_HEX", "")
          if len(seed) != 64 or any(c not in "0123456789abcdefABCDEF" for c in seed):
              raise SystemExit("Invalid release seal seed")
          values = ", ".join("0x" + seed[i:i+2] for i in range(0, 64, 2))
          path = Path("app/src/main/cpp/rasp_guard.cpp")
          source = path.read_text()
          old = "static const unsigned char _alvsia_seal_seed[32] = {0};"
          if source.count(old) != 1:
              raise SystemExit("Native seal seed placeholder missing or ambiguous")
          path.write_text(source.replace(old, "static const unsigned char _alvsia_seal_seed[32] = {" + values + "};"))
          print("PASS: native release seal seed injected")
          PY

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build_full.log
          test -d app/build/outputs/apk/release
          find app/build/outputs/apk/release -type f -name '*.apk' -print -quit | grep -q .

      - name: Strip VCS metadata and audit unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          python3 tools/strip_vcs_metadata.py "$APK"
          python3 tools/audit_release_apk.py "$APK"
          python3 tools/audit_release_metadata.py "$APK"

      - name: Build pinned XopProtector packer and native shell
        shell: bash
        run: |
          set -euo pipefail
          XOP_ROOT="$RUNNER_TEMP/XopProtector"
          git clone --filter=blob:none https://github.com/xopJack/XopProtector.git "$XOP_ROOT"
          git -C "$XOP_ROOT" checkout --detach b4b3c8ab3c47e536adb324cfafeb5e24964cc2bd
          # This pinned upstream revision includes a Windows-only SDK path in settings.gradle.kts.
          # Remove that optional path on Linux CI; ANDROID_HOME remains the authoritative SDK.
          python3 - "$XOP_ROOT/settings.gradle.kts" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()
          marker = "SDK-Android@5.14-20260706"
          filtered = [line for line in lines if marker not in line]
          if len(filtered) == len(lines):
              raise SystemExit("Expected optional Windows SDK path not found")
          cleaned = "\n".join(filtered) + "\n"
          if marker in cleaned:
              raise SystemExit("Windows SDK path still remains")
          path.write_text(cleaned)
          print("PASS: removed optional Windows-only SDK candidates")
          PY
          chmod +x "$XOP_ROOT/gradlew"
          (
            cd "$XOP_ROOT"
            ./gradlew --no-daemon :packer:jar exportShellFiles
          )
          PACKER_JAR="$(find "$XOP_ROOT/packer/build/libs" -maxdepth 1 -type f -name 'protector-packer-*.jar' | sort -V | tail -n 1)"
          test -s "$PACKER_JAR"
          test -s "$XOP_ROOT/executable/shell-files/dex/classes.dex"
          test -s "$XOP_ROOT/executable/shell-files/libs/arm64-v8a/libprotector.so"
          echo "PASS: pinned XopProtector packer and arm64 shell built"
          echo "XOP_ROOT=$XOP_ROOT" >> "$GITHUB_ENV"
          echo "XOP_PACKER_JAR=$PACKER_JAR" >> "$GITHUB_ENV"

      - name: Apply XopProtector to ALVSIA APK
        shell: bash
        run: |
          set -euo pipefail
          INPUT_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          OUTPUT_APK="$RUNNER_TEMP/ALVSIA_PRO_5.5.2-hardened_xop_unsigned.apk"
          test -s "$INPUT_APK"
          java -jar "$XOP_PACKER_JAR" "$INPUT_APK" -o "$OUTPUT_APK" \
            --shell-dir "$XOP_ROOT/executable/shell-files" \
            --profile industry \
            --cert-sha256 99b33815c88a17abbcfe22be15250363f6dfc79c11ffc980e71b62b74b1f295c \
            --risk-flags 0 \
            --rasp-action 0
          test -s "$OUTPUT_APK"
          # Ensure packer actually transformed the APK and added its runtime payload.
          python3 - "$OUTPUT_APK" <<'PY'
          import sys, zipfile
          from pathlib import Path
          apk = Path(sys.argv[1])
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              required = {
                  "assets/protector/dexes.zip",
                  "assets/protector/code.bin",
                  "assets/protector/config.json",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("FAIL XopProtector payload missing: " + ", ".join(missing))
              if "lib/arm64-v8a/libprotector.so" not in names:
                  raise SystemExit("FAIL XopProtector native shell missing for arm64-v8a")
              with z.open("assets/protector/dexes.zip") as stream:
                  if stream.read(4) != b"PDX1":
                      raise SystemExit("FAIL XopProtector DEX payload is not PDX1 encrypted")
              if not any(n.startswith("assets/protector/") for n in names):
                  raise SystemExit("FAIL XopProtector runtime assets not found")
          print("PASS: XopProtector runtime payload verified in transformed APK")
          PY
          # Guardrails: preserve package identity, launcher entry point, and every declared permission.
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump permissions "$INPUT_APK" | sed -E '/^package:/d' | sort -u > "$RUNNER_TEMP/original-permissions.txt"
          "$AAPT" dump permissions "$OUTPUT_APK" | sed -E '/^package:/d' | sort -u > "$RUNNER_TEMP/xop-permissions.txt"
          diff -u "$RUNNER_TEMP/original-permissions.txt" "$RUNNER_TEMP/xop-permissions.txt"
          BADGING="$("$AAPT" dump badging "$OUTPUT_APK")"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.alvsia.pro' versionCode='98' versionName='5.5.2-hardened'"
          printf '%s\n' "$BADGING" | grep -Fq "launchable-activity: name='com.alvsia.pro.MainActivity'"
          echo "PASS: package, launcher and declared permissions preserved by XopProtector"
          python3 tools/audit_release_apk.py "$OUTPUT_APK"
          echo "ALVSIA_XOP_UNSIGNED_APK=$OUTPUT_APK" >> "$GITHUB_ENV"
          echo "PASS: XopProtector candidate created; output will be signed only after audits"

      - name: Restore sealed Python sources in workspace
        if: always()
        run: python3 tools/seal_python.py --restore || true

      - name: Align, sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="${ALVSIA_XOP_UNSIGNED_APK:?XopProtector candidate path missing}"
          test -s "$UNSIGNED"

          KS="$RUNNER_TEMP/alvsia-release.keystore"
          python3 - "$KS" <<'PY'
          import base64, os, sys
          raw = "".join(os.environ["ALVSIA_RELEASE_KEYSTORE_BASE64"].split())
          try:
              data = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit("ALVSIA_RELEASE_KEYSTORE_BASE64 is not valid base64") from exc
          if not data:
              raise SystemExit("Decoded keystore is empty")
          with open(sys.argv[1], "wb") as f:
              f.write(data)
          os.chmod(sys.argv[1], 0o600)
          PY

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          SIGNED_APK="$GITHUB_WORKSPACE/ALVSIA_PRO_5.5.2-hardened_signed.apk"

          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" "$RUNNER_TEMP/alvsia-release-aligned.apk"
          # Validate the configured key password first; if this keystore uses the
          # store password for its private key too, retry without exposing secrets.
          if ! "$BUILD_TOOLS/apksigner" sign \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --ks "$KS" \
            --ks-key-alias "$ALVSIA_RELEASE_KEY_ALIAS" \
            --ks-pass "pass:$ALVSIA_RELEASE_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ALVSIA_RELEASE_KEY_PASSWORD" \
            --out "$SIGNED_APK" "$RUNNER_TEMP/alvsia-release-aligned.apk"; then
            rm -f "$SIGNED_APK"
            echo "Configured private-key password failed; trying keystore password for the private key."
            "$BUILD_TOOLS/apksigner" sign \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --ks "$KS" \
              --ks-key-alias "$ALVSIA_RELEASE_KEY_ALIAS" \
              --ks-pass "pass:$ALVSIA_RELEASE_KEYSTORE_PASSWORD" \
              --key-pass "pass:$ALVSIA_RELEASE_KEYSTORE_PASSWORD" \
              --out "$SIGNED_APK" "$RUNNER_TEMP/alvsia-release-aligned.apk"
          fi

          VERIFY_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK")"
          printf '%s\n' "$VERIFY_OUTPUT"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Eqi 'Verified using v1 scheme.*: true'
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Eqi 'Verified using v2 scheme.*: true'
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Eqi 'Verified using v3 scheme.*: true'

          EXPECTED_CERT_SHA256="$(grep 'CERT_SHA256' app/build.gradle.kts | grep -oE '[0-9a-fA-F]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          ACTUAL_CERT_SHA256="$("$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED_APK" | awk -F': ' '/certificate SHA-256 digest/ {gsub(":", "", $NF); print tolower($NF); exit}')"
          test -n "$EXPECTED_CERT_SHA256"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "FAIL: signing certificate does not match CERT_SHA256 pin"
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT_SHA256"
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -c -v 4 "$SIGNED_APK"
          python3 tools/audit_release_apk.py "$SIGNED_APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$SIGNED_APK")"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.alvsia.pro' versionCode='98' versionName='5.5.2-hardened'"
          sha256sum "$SIGNED_APK" | tee "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          echo "PASS: XopProtector-protected APK, v1/v2/v3 signatures, certificate pin, zip alignment, package and version verified"
          rm -f "$KS"

      - name: Upload signed release APK and audit logs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALVSIA_PRO_5.5.2-hardened-signed
          if-no-files-found: error
          retention-days: 14
          path: |
            ALVSIA_PRO_5.5.2-hardened_signed.apk
            SHA256SUMS.txt
            build_full.log
            release_security_audit.txt
